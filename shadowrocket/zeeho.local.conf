#!name=极核 ZEEHO · Shadowrocket 版（本地脚本）
#!desc=极核ZEEHO多账号签到 + 网页面板（Shadowrocket 适配版·本地脚本，无需网络下载）。面板入口 http://zeeho.box；打开极核App自动捕获 Token/appId；每日 07:00 定时签到。需安装并信任 Shadowrocket CA 证书并开启 MITM。
#!author=lucky
#!homepage=https://github.com/cluck798/ZEEHO
#!icon=https://cdn.jsdelivr.net/gh/cluck798/ZEEHO@main/script/ZEEHO.png
#!date=2026-09-24

# ========== 使用说明（本地脚本版） ==========
# 1) 先将两个脚本文件放入 Shadowrocket 本地目录（二选一）：
#    · 「文件」App → 我的iPhone → Shadowrocket（直接拷入 zeeho.js 与 zeeho_box_enhanced.js）
#    · 或电脑 iTunes/访达 → 文件共享 → Shadowrocket → 拖入两个 .js 文件
# 2) 再导入本 .conf 并在首页·配置 中启用（不是「模块」）。
# 3) 面板入口请手动输入 http://zeeho.box（注意是 http 协议）。
# 4) Shadowrocket → 设置 → 证书 → 安装并信任 CA（描述文件安装后还需在
#    iOS 设置 → 通用 → 关于本机 → 证书信任设置 中开启完全信任）；
#    设置 → MITM → 打开开关并确认 hostname 已包含下方 [MITM] 列表。
# 5) 打开极核App「我的」页面 → 自动捕获 Token；浏览器打开面板 → 配置账号。

[Host]
# 面板虚拟域名占位解析：实际响应由 http-request 脚本拦截并直接返回，
# 请求不会真正发往 127.0.0.1
zeeho.box = 127.0.0.1

[Script]
# ================ 极核 ZEEHO ================
# 面板入口（http://zeeho.box）+ 极核API自动捕获 appId
# 脚本内部分流：zeeho.box → 返回面板HTML；zeehoev.com → 捕获 appId 后放行
http-request ^https?:\/\/(zeeho\.box|.*zeehoev\.com)\/.* script-path=zeeho_box_enhanced.js, requires-body=true, timeout=60, tag=极核面板

# 极核Token自动捕获（打开极核App → 我的页面，读取 /setting 响应体）
http-response ^https?:\/\/tapi\.zeehoev\.com\/v1\.0\/mine\/cfmotoservermine\/setting script-path=zeeho.js, requires-body=true, timeout=60, tag=极核抓Token

# 极核每日签到（每天 07:00，可自行修改时间）
cron "0 7 * * *" script-path=zeeho.js, tag=极核每日签到

[MITM]
hostname = tapi.zeehoev.com, h5.zeehoev.com, zeeho.box
