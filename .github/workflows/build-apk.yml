name: build-apk

# 极核签到面板 Android APK 构建：push 到 main（android/ 或核心脚本变动）时构建签名 APK 并发布到 Release
on:
  push:
    branches: [ main ]
    paths:
      - "android/**"
      - "repo/zeeho_box_enhanced.js"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 platforms;android-36 build-tools;34.0.0 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false

      - name: Sync core script
        run: cp repo/zeeho_box_enhanced.js android/app/src/main/assets/zeeho_box_enhanced.js

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          # --no-daemon：CI 单次构建无需常驻 daemon
          ./gradlew assembleRelease --no-daemon

      - name: Decode keystore from secret
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE is empty or not set. Go to Settings → Secrets and variables → Actions, ensure a secret named EXACTLY 'SIGNING_KEYSTORE' (case-sensitive) exists with the Base64 content of release.keystore.b64 (one single line, no leading/trailing whitespace)."
            exit 1
          fi
          # 诊断：长度、首尾字符、是否包含空白（不输出 Secret 内容本身）
          echo "Secret length: ${#KEYSTORE_BASE64} chars"
          echo "First 8 chars: ${KEYSTORE_BASE64:0:8}..."
          echo "Last 8 chars: ...${KEYSTORE_BASE64: -8}"
          if echo "$KEYSTORE_BASE64" | grep -q '[[:space:]]'; then
            echo "::error::Secret contains whitespace (spaces/newlines/tabs). Re-paste the Base64 as a single line with no leading/trailing whitespace."
            exit 1
          fi
          # 解码并验证字节数
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          BYTE_SIZE=$(wc -c < android/release.keystore)
          echo "Decoded keystore size: ${BYTE_SIZE} bytes"
          if [ "$BYTE_SIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore is too small (${BYTE_SIZE} bytes < 1000). Secret content is likely corrupted or incomplete."
            exit 1
          fi
          ls -la android/release.keystore
          # keytool 验证 keystore 是否合法（密码错误也会失败，但能确认是合法 PKCS12）
          if ! keytool -list -keystore android/release.keystore -storepass android 2>&1 | tee keystore-check.log; then
            echo "::warning::keytool verification failed; see log above. Build will still attempt to continue, signing will fail if keystore is invalid."
          fi

      - name: Sign APK
        run: |
          set -e
          cd android
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=app/build/outputs/apk/release/app-release-aligned.apk
          FINAL=ZeehoSignPanel.apk
          "$ZIPALIGN" -f -v 4 "$UNSIGNED" "$ALIGNED"
          # 使用仓库 Secret 中固定的 keystore 签名（覆盖安装升级，无需卸载旧版）
          "$APKSIGNER" sign --ks release.keystore --ks-pass pass:android \
            --ks-key-alias zeeho --key-pass pass:android "$ALIGNED"
          "$APKSIGNER" verify --verbose "$ALIGNED" || true
          mv "$ALIGNED" "$FINAL"
          ls -la "$FINAL"

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 极核签到面板 Android APK
          body: |
            Android 安装包（APK）。
            - minSdk 24 / targetSdk 34
            - 内核：构建时自动同步 repo/zeeho_box_enhanced.js
            - 签名：仓库固定 keystore 签名，新版本可直接覆盖安装（无需卸载旧版）
            - 构建提交：${{ github.sha }}
          files: android/ZeehoSignPanel.apk
          overwrite: true
          make_latest: true

      - name: Collect build log on failure
        if: failure()
        run: |
          touch android/build.log
          tail -c 300000 android/build.log > android/build-tail.log || true

      - name: Upload build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 极核签到面板 Android APK
          files: android/build-tail.log
          overwrite: true
