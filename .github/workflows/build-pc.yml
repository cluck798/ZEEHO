name: build-pc

# 极核签到面板 Windows 桌面版构建：push 到 main（desktop/ 或核心脚本变动）时构建 NSIS Setup + Portable 并发布到 Release
on:
  push:
    branches: [ main ]
    paths:
      - "desktop/**"
      - "repo/zeeho_box_enhanced.js"
      - ".github/workflows/build-pc.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-pc
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm install --legacy-peer-deps

      - name: Build (NSIS Setup + Portable)
        working-directory: desktop
        run: |
          npm run dist
          npm run dist:portable

      - name: List dist
        working-directory: desktop
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name,Length

      - name: Compute build time (Beijing)
        id: bt
        run: echo "BJ=$((Get-Date).ToUniversalTime().AddHours(8).ToString('yyyy-MM-dd HH:mm'))" >> $env:GITHUB_OUTPUT

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-latest
          name: 极核签到面板 Windows 桌面版
          body: |
            Windows 桌面版安装包。
            - Setup 安装版（NSIS，x64）
            - Portable 便携版（x64）
            - 内核：构建时打包 repo/zeeho_box_enhanced.js
            - 更新时间：${{ steps.bt.outputs.BJ }}（北京时间）
            - 构建提交：${{ github.sha }}
          files: |
            desktop/dist/*Setup*.exe
            desktop/dist/*Portable*.exe
          overwrite: true
          make_latest: true

      # 只保留最新版本：资产文件名带版本号，publish 后删除不含当前版本的全部旧资产
      - name: Prune old assets (keep only current version)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./desktop/package.json').version")
          echo "keep version: $VER"
          REL_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/pc-latest" | jq -r .id)
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets?per_page=100" \
            | jq -r --arg v "$VER" '.[] | select(.name | contains($v) | not) | .id' \
            | while read -r id; do
                [ -n "$id" ] && curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" > /dev/null && echo "pruned asset $id"
              done
