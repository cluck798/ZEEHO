<title>极核 ZEEHO 面板</title>
<style>
/* ============ reset & tokens ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0A0F1E; --bg2:#0C1324;
  --card:rgba(146,170,205,.055); --card2:#111A2E; --card3:#0E1628;
  --line:rgba(146,170,205,.13); --line2:rgba(146,170,205,.22);
  --txt:#EAF1FB; --txt2:#93A0B8; --txt3:#5E6E88;
  --brand:#2BD4F2; --brand2:#0E8FB2; --brandSoft:rgba(43,212,242,.13);
  --ok:#3DDC97; --okSoft:rgba(61,220,151,.14);
  --warn:#F7B955; --warnSoft:rgba(247,185,85,.14);
  --err:#F9706A; --errSoft:rgba(249,112,106,.14);
  --vio:#B7A6FB; --vioSoft:rgba(183,166,251,.14);
  --grad:linear-gradient(135deg,#2BD4F2,#0E8FB2);
  --grad-vio:linear-gradient(135deg,#B7A6FB,#7C6BF0);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --spring:cubic-bezier(.32,1.4,.44,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

.veh-switch{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 4px}.veh-sw-label{font-size:11px;color:var(--txt3);margin-right:2px}.veh-chip{border:1px solid var(--line2);background:var(--card3);color:var(--txt2);border-radius:20px;padding:5px 11px;font-size:12px;cursor:pointer}.veh-chip.on{background:var(--brandSoft);border-color:var(--brand);color:var(--brand)}
.signin-fab{position:fixed;right:16px;bottom:calc(78px + var(--safe-b));z-index:998;display:flex;align-items:center;gap:6px;padding:12px 18px;border-radius:999px;background:var(--grad);color:#fff;font-size:13px;font-weight:800;letter-spacing:.5px;box-shadow:0 8px 24px rgba(14,143,178,.45),inset 0 1px 0 rgba(255,255,255,.25);cursor:pointer;transition:transform .16s var(--spring),opacity .2s;-webkit-tap-highlight-color:transparent}
.signin-fab:active{transform:scale(.92)}
.signin-fab.busy{opacity:.6;pointer-events:none}
.signin-fab svg{width:15px;height:15px}

html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Segoe UI",sans-serif;
  background:var(--bg); color:var(--txt); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,select,textarea{font-family:inherit;color:var(--txt);background:var(--card3);border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;width:100%;outline:none;transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandSoft)}
input::placeholder,textarea::placeholder{color:var(--txt3)}
svg{display:block}
::selection{background:var(--brandSoft)}
::-webkit-scrollbar{width:0;height:0}

/* ============ app shell ============ */
#app{min-height:100%;display:flex;flex-direction:column}
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(52% 38% at 12% -6%, rgba(43,212,242,.14), transparent 62%),
    radial-gradient(46% 34% at 92% 6%, rgba(14,143,178,.12), transparent 62%),
    radial-gradient(60% 40% at 50% 110%, rgba(124,107,240,.08), transparent 65%);
}
header.app-header{
  position:sticky;top:0;z-index:60;
  padding:calc(12px + var(--safe-t)) 18px 12px;
  background:rgba(10,15,30,.78);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
  border-bottom:1px solid rgba(146,170,205,.09);
  display:flex;align-items:center;gap:12px;
}
.brand-mark{width:38px;height:38px;border-radius:12px;flex-shrink:0;overflow:hidden;box-shadow:0 6px 18px rgba(14,143,178,.28)}
.brand-mark img{width:100%;height:100%;display:block;object-fit:cover}
.brand-txt{flex:1;min-width:0}
.brand-txt h1{font-size:16px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.brand-txt p{font-size:11px;color:var(--txt3);margin-top:1px}

.head-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
.icon-btn{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt2);transition:transform .18s var(--spring),background .2s,color .2s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.primary{background:var(--grad);color:#04121C;border:none}
.count-chip{display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--txt2);min-width:96px;justify-content:center;transition:border-color .2s}
.count-chip.on{border-color:rgba(43,212,242,.4);color:var(--brand);background:var(--brandSoft)}
.count-ring{width:14px;height:14px;position:relative;flex-shrink:0}
.count-ring svg{transform:rotate(-90deg);width:14px;height:14px}
.count-ring .track{stroke:rgba(146,170,205,.18);fill:none;stroke-width:2}
.count-ring .arc{stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;transition:stroke-dashoffset .5s linear}

main{flex:1;position:relative;z-index:1;padding:14px 16px calc(150px + var(--safe-b))}

/* ============ pull to refresh ============ */
.ptr-wrap{position:relative;overflow:hidden}
.ptr-indicator{height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:height .3s var(--ease);color:var(--txt3);font-size:12px;font-weight:600}
.ptr-indicator .spinner{width:20px;height:20px;margin-right:8px;border:2px solid var(--line2);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
.ptr-indicator.pulling .spinner{animation:none;border-top-color:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ hero summary ============ */
.hero{
  position:relative;border-radius:var(--r-lg);padding:18px 18px 16px;margin-bottom:16px;overflow:hidden;
  background:linear-gradient(160deg,rgba(43,212,242,.14),rgba(14,143,178,.05) 55%,transparent),var(--card);
  border:1px solid rgba(43,212,242,.16);
}
.hero::after{content:'';position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(43,212,242,.16),transparent 65%);pointer-events:none}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero-score .lbl{font-size:11px;color:var(--txt3);font-weight:600;letter-spacing:1px}
.hero-score .val{font-size:38px;font-weight:900;line-height:1.15;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-feature-settings:"tnum"}
.hero-score .val small{font-size:14px;font-weight:700}
.hero-right{text-align:right;flex-shrink:0}
.hero-right .big{font-size:22px;font-weight:900;color:var(--ok)}
.hero-right .big span{font-size:12px;color:var(--txt3);font-weight:600}
.hero-right .sub{font-size:11px;color:var(--txt3);margin-top:2px}
.hero-stats{display:flex;gap:10px;margin-top:14px}
.hstat{flex:1;background:rgba(10,15,30,.5);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.hstat .v{font-size:17px;font-weight:800;font-feature-settings:"tnum"}
.hstat .l{font-size:10px;color:var(--txt3);margin-top:1px;font-weight:600}
.hstat.amber .v{color:var(--warn)} .hstat.cyan .v{color:var(--brand)} .hstat.green .v{color:var(--ok)}

/* ============ buttons & chips ============ */
.fab{
  position:fixed;right:16px;bottom:calc(100px + var(--safe-b));z-index:50;
  display:flex;align-items:center;gap:7px;height:46px;padding:0 16px;border-radius:23px;
  background:var(--grad);color:#04121C;font-size:14px;font-weight:800;letter-spacing:.3px;
  box-shadow:0 10px 28px rgba(14,143,178,.45),inset 0 1px 0 rgba(255,255,255,.3);
  transition:transform .2s var(--spring),box-shadow .2s;animation:fab-in .5s var(--spring) both;
}
.fab:active{transform:scale(.94)}
.fab svg{width:17px;height:17px}
@keyframes fab-in{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border-radius:13px;
  font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--txt);
  transition:transform .16s var(--spring),background .2s,border-color .2s;
}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--grad);color:#04121C;border:none}
.btn.ghost{background:transparent;color:var(--txt2)}
.btn.danger{background:var(--errSoft);color:var(--err);border-color:rgba(249,112,106,.28)}
.btn.sm{height:32px;padding:0 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:15px;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);color:var(--txt2);transition:transform .16s var(--spring)}
.chip:active{transform:scale(.94)}
.chip.on{background:var(--brandSoft);border-color:rgba(43,212,242,.35);color:var(--brand)}
.chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;font-size:11px;font-weight:700;flex-shrink:0}
.pill.ok{background:var(--okSoft);color:var(--ok)}
.pill.miss{background:var(--errSoft);color:var(--err)}
.pill.cyan{background:var(--brandSoft);color:var(--brand)}
.pill.gray{background:rgba(146,170,205,.12);color:var(--txt2)}
.pill.vio{background:var(--vioSoft);color:var(--vio)}
.pill.amber{background:var(--warnSoft);color:var(--warn)}

/* ============ account cards ============ */
.section-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--txt2);margin:4px 2px 12px;letter-spacing:.5px}
.section-title svg{width:15px;height:15px;color:var(--brand)}
.acc-card{
  position:relative;border-radius:var(--r-lg);padding:16px;margin-bottom:14px;overflow:hidden;
  background:linear-gradient(180deg,rgba(146,170,205,.06),rgba(146,170,205,.03)),var(--card);
  border:1px solid var(--line);
  transition:transform .2s var(--ease);
}
/* 入场动画只在首次渲染播放，避免自动刷新重建卡片时整屏重闪 */
.acc-card.anim-in{animation:card-in .45s var(--ease) both}
.acc-card.error{border-color:rgba(249,112,106,.4);background:linear-gradient(180deg,rgba(249,112,106,.07),transparent),var(--card)}
@keyframes card-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
/* ============ v2.14.14 首页卡片（图3风格） ============ */
.home-card{padding:16px 16px 14px}
.hc-upd{position:absolute;top:12px;right:14px;font-size:10.5px;color:var(--txt3)}
.hc-top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.hc-name{font-size:19px;font-weight:800;letter-spacing:.3px}
.hc-badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:8px;background:var(--card3);border:1px solid var(--line);color:var(--txt2)}
.hc-badge.on{background:var(--okSoft);border-color:transparent;color:var(--ok)}
.hc-badge.err{background:var(--errSoft);border-color:transparent;color:var(--err)}
.hc-badge.chg{background:var(--brandSoft);border-color:transparent;color:var(--brand)}
.hc-model{font-size:11.5px;color:var(--txt2);margin-bottom:10px}
.hc-mid{display:flex;gap:12px;align-items:center;margin:6px 0 10px}
.hc-left{flex:1;min-width:0}
.hc-big{font-size:38px;font-weight:900;line-height:1.1;letter-spacing:-1px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.hc-km{font-size:19px;font-weight:800;color:var(--txt)}
.hc-v{font-size:19px;font-weight:800;color:var(--txt2)}
.hc-bar{height:9px;border-radius:6px;background:rgba(146,170,205,.16);overflow:hidden;margin:8px 0 10px}
.hc-fill{height:100%;border-radius:6px;transition:width .7s var(--ease)}
.hc-rows{display:flex;flex-direction:column;gap:3px}
.hc-row{font-size:12px;color:var(--txt2);font-weight:600}
.hc-img{width:118px;height:96px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--txt3)}
.hc-img img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
.hc-img img+svg{display:none}
.hc-img svg{width:72px;height:72px}
.hc-bottom{border-top:1px dashed var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.hc-score{display:flex;gap:12px;align-items:baseline;font-size:12px;color:var(--txt2);font-weight:700;flex-wrap:wrap}
.hc-score .signed{color:var(--ok)}
/* 充电中：整张卡片流光（卡面低透明度渐变流动 + 边缘描边流光） */
.home-card.charging{position:relative;z-index:0;border-color:rgba(43,212,242,.28)}
.home-card.charging::before{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(43,212,242,0) 0%,rgba(43,212,242,.10) 22%,rgba(61,220,151,.20) 42%,rgba(43,212,242,.10) 62%,rgba(43,212,242,0) 100%);background-size:220% 220%;animation:hc-flow 3.4s linear infinite}
.home-card.charging::after{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(90deg,rgba(43,212,242,0),#2BD4F2,#3DDC97,rgba(43,212,242,0));background-size:300% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;animation:hc-run 2.4s linear infinite}
@keyframes hc-flow{from{background-position:0% 0}to{background-position:220% 0}}
@keyframes hc-run{from{background-position:0% 0}to{background-position:300% 0}}
.hc-score b{color:var(--txt);font-size:13px}
.hc-score .plus{color:var(--brand)}
.hc-score .streak{color:var(--err)}
.acc-head{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.avatar{width:42px;height:42px;border-radius:13px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px;color:#04121C;flex-shrink:0;box-shadow:0 4px 14px rgba(14,143,178,.3)}
.avatar.vio{background:var(--grad-vio);color:#140F2E;box-shadow:0 4px 14px rgba(124,107,240,.3)}
.acc-info{flex:1;min-width:0}
.acc-name{font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-sub{font-size:11px;color:var(--txt3);margin-top:1px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.acc-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
.acc-err{font-size:12px;color:var(--err);background:var(--errSoft);border-radius:10px;padding:8px 11px;margin-bottom:12px;font-weight:600}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.kpi{background:rgba(10,15,30,.45);border:1px solid var(--line);border-radius:14px;padding:9px 2px;text-align:center}
.kpi .v{font-size:17px;font-weight:900;font-feature-settings:"tnum";line-height:1.2}
.kpi .l{font-size:9.5px;color:var(--txt3);font-weight:600;margin-top:2px}
.kpi.c1 .v{color:var(--txt)} .kpi.c2 .v{color:var(--ok)} .kpi.c3 .v{color:var(--brand)} .kpi.c4 .v{color:var(--vio)}
.blind{margin-bottom:14px}
.blind-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--txt2);font-weight:700;margin-bottom:6px}
.blind-top .r{color:var(--vio);font-feature-settings:"tnum"}
.blind-bar{height:14px;border-radius:8px;background:rgba(146,170,205,.1);overflow:hidden;border:1px solid var(--line)}
.blind-fill{height:100%;border-radius:8px;background:var(--grad-vio);transition:width .7s var(--ease);box-shadow:0 0 12px rgba(124,107,240,.5)}
.week{margin-bottom:4px}
.week-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--txt2);font-weight:700;margin-bottom:7px}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:rgba(10,15,30,.5);border:1px solid var(--line)}
.day .d{font-size:9px;color:var(--txt3);font-weight:700;line-height:1}
.day .m{font-size:8px;line-height:1}
.day.ok{background:var(--brandSoft);border-color:rgba(43,212,242,.35)}
.day.ok .d{color:var(--brand)}
.day.today{background:var(--grad);border:none;box-shadow:0 4px 12px rgba(14,143,178,.4)}
.day.today .d{color:#04121C}
.day.today .m{color:rgba(4,18,28,.7)}

/* ============ vehicle section ============ */
.vehicle{
  margin-top:14px;padding-top:14px;border-top:1px dashed var(--line2);cursor:pointer;
}
.vehicle-top{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.vehicle-ring{position:relative;width:74px;height:74px;flex-shrink:0}
.vehicle-ring svg{width:74px;height:74px;transform:rotate(-90deg)}
.vehicle-ring .track{stroke:rgba(146,170,205,.14);fill:none;stroke-width:5}
.vehicle-ring .arc{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease),stroke .5s}
.vehicle-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;font-feature-settings:"tnum"}
.vehicle-meta{flex:1;min-width:0}
.vehicle-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vehicle-vin{font-size:10px;color:var(--txt3);margin-top:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.vin-show{font-size:10px;font-weight:700;color:var(--brand);margin-left:4px;padding:1px 6px;border-radius:5px;background:var(--brandSoft)}
.vehicle-badges{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.vstat-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.vstat{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:13px;font-size:11px;font-weight:700}
.vstat svg{width:12px;height:12px}
.vstat.on{background:var(--okSoft);color:var(--ok)}
.vstat.off{background:rgba(146,170,205,.1);color:var(--txt2)}
.vstat.locked{background:var(--errSoft);color:var(--err)}
.vstat.unlocked{background:var(--okSoft);color:var(--ok)}
.vstat.seat{background:var(--vioSoft);color:var(--vio)}
.charge-banner{display:flex;align-items:center;gap:9px;background:var(--okSoft);border:1px solid rgba(61,220,151,.25);border-radius:12px;padding:9px 12px;margin-bottom:12px}
.charge-banner svg{width:15px;height:15px;color:var(--ok);flex-shrink:0}
.charge-banner .ct{font-size:13px;font-weight:800;color:var(--ok)}
.charge-banner .ce{font-size:11px;color:var(--ok);opacity:.85;margin-left:auto;background:rgba(61,220,151,.15);padding:2px 9px;border-radius:10px}
.vkpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.vkpi{background:rgba(10,15,30,.45);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center}
.vkpi .v{font-size:14px;font-weight:900;font-feature-settings:"tnum"}
.vkpi .l{font-size:9px;color:var(--txt3);font-weight:600;margin-top:2px}
.batt-track{height:9px;border-radius:5px;background:rgba(146,170,205,.1);overflow:hidden;margin-bottom:12px;border:1px solid var(--line)}
.batt-fill{height:100%;border-radius:5px;transition:width .8s var(--ease),background .5s;box-shadow:0 0 10px currentColor}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.meta-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--txt2);background:rgba(10,15,30,.45);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-weight:600}
.meta-item svg{width:12px;height:12px;color:var(--brand)}
.meta-item b{color:var(--txt)}
.vehicle-addr{display:flex;align-items:center;gap:8px;margin-top:4px;margin-bottom:10px;font-size:11px;color:var(--txt3)}
.vehicle-addr .at{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vehicle-addr svg{width:13px;height:13px;color:var(--warn);flex-shrink:0}
.map-btn{height:26px;padding:0 11px;border-radius:13px;font-size:11px;font-weight:700;background:var(--brandSoft);color:var(--brand);border:1px solid rgba(43,212,242,.3);flex-shrink:0;transition:transform .16s var(--spring)}
.map-btn:active{transform:scale(.94)}
.map-btn:disabled{opacity:.45;pointer-events:none}
.ctrl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;border-top:1px dashed var(--line2);padding-top:12px}
.ctrl-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:13px;background:rgba(10,15,30,.5);border:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--txt2);transition:transform .16s var(--spring),background .2s,border-color .2s,color .2s}
.ctrl-btn svg{width:17px;height:17px;color:var(--txt2);transition:color .2s}
.ctrl-btn:active{transform:scale(.92)}
.ctrl-btn.unlock{border-color:rgba(61,220,151,.3);color:var(--ok)}
.ctrl-btn.unlock svg{color:var(--ok)}
.ctrl-btn.lock{border-color:rgba(249,112,106,.3);color:var(--err)}
.ctrl-btn.lock svg{color:var(--err)}
.ctrl-btn:disabled{opacity:.5;pointer-events:none}
.ctrl-btn.busy svg{animation:spin .8s linear infinite}
.no-vehicle{padding:14px;border-radius:14px;background:var(--warnSoft);border:1px solid rgba(247,185,85,.25);color:var(--warn);font-size:12px;font-weight:600;text-align:center}

/* ============ empty & skeleton ============ */
.empty{padding:70px 26px;text-align:center;animation:card-in .4s var(--ease) both}
.empty .e-icon{width:74px;height:74px;margin:0 auto 18px;border-radius:24px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt3)}
.empty .e-icon svg{width:34px;height:34px}
.empty h3{font-size:17px;font-weight:800;margin-bottom:6px}
.empty p{font-size:13px;color:var(--txt2);line-height:1.7;max-width:300px;margin:0 auto 20px}
.sk{background:linear-gradient(100deg,rgba(146,170,205,.06) 40%,rgba(146,170,205,.12) 50%,rgba(146,170,205,.06) 60%);background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:10px}
@keyframes sk{to{background-position:-200% 0}}
.sk-card{border-radius:var(--r-lg);border:1px solid var(--line);padding:16px;margin-bottom:14px;background:var(--card)}
.sk-line{height:13px;margin-bottom:10px}.sk-line.w40{width:40%}.sk-line.w60{width:60%}.sk-line.w80{width:80%}
.sk-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.sk-cell{height:52px;border-radius:12px}
.sk-bar{height:14px;border-radius:8px;margin-top:12px}

/* ============ logs ============ */
.log-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;animation:card-in .4s var(--ease) both}
.log-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.log-head h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.log-head h3 svg{width:16px;height:16px;color:var(--vio)}
.log-filters{display:flex;gap:6px}
.log-list{max-height:calc(100vh - 260px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.log-item{padding:12px 16px;border-bottom:1px solid rgba(146,170,205,.07);animation:card-in .3s var(--ease) both}
.log-item:last-child{border-bottom:none}
.log-time{font-size:10px;color:var(--txt3);margin-bottom:3px;font-feature-settings:"tnum"}
.log-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.log-user{font-weight:800}
.log-res{font-weight:800;color:var(--ok)}
.log-res.err{color:var(--err)}
.log-steps{margin-top:6px;font-size:11.5px;color:var(--txt2);line-height:1.7;padding-left:2px}
.log-steps i{font-style:normal;color:var(--brand);margin-right:5px}
.log-empty{padding:50px 20px;text-align:center;color:var(--txt3);font-size:13px}

/* ============ config ============ */
.cfg-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:16px;overflow:hidden;animation:card-in .4s var(--ease) both}
.cfg-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line)}
.cfg-head h3{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.cfg-head h3 svg{width:16px;height:16px}
.cfg-head .bar{width:3px;height:15px;border-radius:2px;background:var(--brand);flex-shrink:0}
.cfg-head .bar.amber{background:var(--warn)} .cfg-head .bar.green{background:var(--ok)} .cfg-head .bar.vio{background:var(--vio)}
.cfg-body{padding:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f-item{min-width:0}
.f-item.full{grid-column:1/-1}
.f-item label{display:block;font-size:11px;color:var(--txt2);font-weight:700;margin-bottom:6px}
.f-item .hint{font-size:10.5px;color:var(--txt3);margin-top:5px;line-height:1.6}
.f-item .hint code{background:rgba(146,170,205,.12);padding:1px 5px;border-radius:5px;font-size:10px;font-family:ui-monospace,Menlo,monospace}
.switch{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(10,15,30,.45);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .2s}
.switch:active{transform:scale(.98)}
.switch .lbl{font-size:12.5px;font-weight:600;flex:1}
.switch .sc{font-size:10px;color:var(--txt3)}
.sw{position:relative;width:44px;height:26px;border-radius:13px;background:rgba(146,170,205,.2);transition:background .25s var(--ease);flex-shrink:0}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s var(--spring);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.switch input{display:none}
.switch input:checked+.sw{background:var(--grad)}
.switch input:checked+.sw::after{transform:translateX(18px)}
.acc-edit{background:rgba(10,15,30,.4);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.acc-edit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.acc-edit-title{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px}
.acc-edit-title .n{width:24px;height:24px;border-radius:8px;background:var(--brandSoft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}
.acc-edit-head .acts{display:flex;gap:6px}
.btn-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:120px}
.cfg-note{font-size:10.5px;color:var(--txt3);line-height:1.7;padding:12px 14px;background:rgba(247,185,85,.07);border:1px solid rgba(247,185,85,.18);border-radius:12px;margin-top:12px}
.cfg-note b{color:var(--warn)}

/* ============ tabbar ============ */
nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  display:flex;padding:8px 10px calc(8px + var(--safe-b));
  background:rgba(10,15,30,.82);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);
  border-top:1px solid rgba(146,170,205,.1);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:14px;color:var(--txt3);font-size:10px;font-weight:700;transition:color .2s,transform .16s var(--spring)}
.tab svg{width:22px;height:22px}
.tab:active{transform:scale(.9)}
.tab.on{color:var(--brand)}
.tab .t-ind{width:14px;height:3px;border-radius:2px;background:transparent;transition:background .25s}
.tab.on .t-ind{background:var(--brand)}

/* ============ sheets & toast ============ */
.sheet-backdrop{position:fixed;inset:0;z-index:100;background:rgba(4,8,18,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.sheet-backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:101;max-height:86vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,var(--card2),var(--bg2));border:1px solid var(--line2);border-bottom:none;
  border-radius:26px 26px 0 0;transform:translateY(104%);transition:transform .38s var(--spring);
  box-shadow:0 -18px 50px rgba(0,0,0,.5)}
.sheet.show{transform:translateY(0)}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:rgba(146,170,205,.3);margin:10px auto 4px;flex-shrink:0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 12px}
.sheet-head h3{font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px}
.sheet-head h3 svg{width:18px;height:18px}
.sheet-close{width:32px;height:32px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt2)}
.sheet-close:active{transform:scale(.9)}
.sheet-body{padding:4px 20px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sr-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(146,170,205,.08);font-size:13px}
.sr-item:last-child{border-bottom:none}
.sr-item .k{color:var(--txt2);font-weight:600;flex-shrink:0}
.sr-item .v{text-align:right;font-weight:800}
.sr-item .v.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.sig-result{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sig-card{border-radius:16px;padding:13px 14px;margin-bottom:10px;border:1px solid var(--line)}
.sig-card.ok{background:var(--okSoft);border-color:rgba(61,220,151,.25)}
.sig-card.fail{background:var(--errSoft);border-color:rgba(249,112,106,.28)}
.sig-card .h{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;margin-bottom:6px}
.sig-card .h .r{font-size:12px}
.sig-card.ok .h .r{color:var(--ok)} .sig-card.fail .h .r{color:var(--err)}
.sig-card .steps{font-size:12px;color:var(--txt2);line-height:1.8}
.sig-card .steps i{font-style:normal;color:var(--brand);margin-right:5px}
.sig-card .steps .err{color:var(--err)}
#toast{position:fixed;left:50%;top:calc(18px + var(--safe-t));transform:translateX(-50%) translateY(-16px);z-index:200;
  display:flex;align-items:center;gap:8px;max-width:86vw;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:700;
  background:rgba(17,26,46,.92);border:1px solid var(--line2);box-shadow:0 10px 34px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .3s var(--spring)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast svg{width:16px;height:16px;flex-shrink:0}
#toast.ok{color:var(--ok)} #toast.err{color:var(--err)} #toast.info{color:var(--brand)}
#toast.ok svg{color:var(--ok)} #toast.err svg{color:var(--err)} #toast.info svg{color:var(--brand)}
.confirm-layer{position:fixed;inset:0;z-index:150;display:flex;align-items:center;justify-content:center;padding:30px}
.confirm{width:min(340px,90vw);background:var(--card2);border:1px solid var(--line2);border-radius:20px;padding:22px 20px 18px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.55);animation:card-in .3s var(--spring) both}
.confirm .ct{font-size:15px;font-weight:800;margin-bottom:6px}
.confirm .cd{font-size:12.5px;color:var(--txt2);line-height:1.7;margin-bottom:18px}
.confirm .cb{display:flex;gap:10px}
.confirm .cb button{flex:1;height:42px;border-radius:13px;font-size:14px;font-weight:700}
.confirm .cb .no{background:var(--card);border:1px solid var(--line);color:var(--txt2)}
.confirm .cb .yes{background:var(--grad);color:#04121C}

/* ============ misc ============ */
.foot{text-align:center;padding:10px 0 4px;font-size:10.5px;color:var(--txt3);line-height:1.8}
.foot .link{color:var(--brand);text-decoration:none;font-weight:700}
.hidden{display:none!important}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (min-width:700px){
  main{max-width:680px;margin:0 auto}
}
@media (max-width:699px){
  input[type=text],input[type=password],input[type=number],textarea{font-size:16px!important}
}

/* ============ v2.14.9 积分 / 车辆页组件 ============ */
.acc-chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.acc-chips::-webkit-scrollbar{display:none}
.acc-chip{flex-shrink:0;padding:7px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--txt2)}
.acc-chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px var(--brandSoft)}
.pt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pt-cell{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;animation:card-in .4s var(--ease) both}
.pt-cell .lb{font-size:11px;color:var(--txt3);font-weight:600;margin-bottom:5px}
.pt-cell .vl{font-size:22px;font-weight:800;line-height:1.15}
.pt-cell .sub{font-size:10px;color:var(--txt3);margin-top:3px}
.panel-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;margin-bottom:14px;animation:card-in .4s var(--ease) both}
.panel-card .pc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.panel-card .pc-head h4{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px}
.panel-card .pc-head h4 svg{width:16px;height:16px;color:var(--brand)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-wd{font-size:10px;color:var(--txt3);text-align:center;font-weight:700;padding-bottom:3px}
.cal-d{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:var(--card3);color:var(--txt2);border:1.5px solid transparent}
.cal-d.signed{background:var(--okSoft);color:var(--ok)}
.cal-d.miss{background:var(--errSoft);color:var(--err)}
.cal-d.today{border-color:var(--brand)}
.cal-d.future{opacity:.38}
.cal-d.blank{background:transparent}
.cal-d .dot{font-size:8px;line-height:1;margin-top:1px}
.vc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.vc-btn{background:var(--card3);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--txt)}
.vc-btn svg{width:21px;height:21px;color:var(--brand)}
.vc-btn:active{transform:scale(.94)}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0}
.opt-chip{padding:8px 14px;border-radius:10px;background:var(--card3);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--txt2)}
.opt-chip.on{background:var(--brandSoft);border-color:var(--brand);color:var(--brand)}
.flow-item{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.flow-item:last-child{border-bottom:none}
.flow-item .nm{font-size:13px;font-weight:600}
.flow-item .tm{font-size:10px;color:var(--txt3);margin-top:2px}
.flow-item .sc{font-size:14px;font-weight:800}
.flow-item .sc.plus{color:var(--ok)}
.flow-item .sc.minus{color:var(--err)}
.mon-row{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
.mon-row:last-child{border-bottom:none}
.mon-row .k{color:var(--txt3);font-weight:600}
.mon-row .v{font-weight:700}
/* ============ 入场闪屏：首帧即显示，数据就绪后淡出 ============ */
#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 60% at 50% 0%,rgba(14,143,178,.16),transparent 60%),var(--bg);transition:opacity .4s var(--ease),transform .4s var(--ease)}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-mark{width:84px;height:84px;border-radius:24px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 40px rgba(14,143,178,.4);animation:sp-in .6s var(--spring) both}
.sp-mark svg{width:46px;height:46px}
.sp-title{margin-top:20px;font-size:21px;font-weight:900;letter-spacing:1px;animation:sp-up .5s .12s var(--ease) both}
.sp-sub{margin-top:7px;font-size:12px;color:var(--txt3);letter-spacing:3px;animation:sp-up .5s .2s var(--ease) both}
.sp-load{margin-top:34px;display:flex;align-items:center;gap:9px;font-size:12px;color:var(--txt2);animation:sp-up .5s .3s var(--ease) both}
.sp-load .spinner{width:16px;height:16px;border:2px solid var(--line2);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes sp-in{from{opacity:0;transform:scale(.6) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes sp-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>

<script>
"use strict";
/* ================= 常量 ================= */
const APP_VERSION = "v2.14.16";
const KEYS = { cfg:"zeeho_cfg", accounts:"zeeho_accounts", logs:"zeeho_logs" };

/* ================= 工具函数 ================= */
function getUuid(){const p="xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx",c="abcdef0123456789";let r="";for(const ch of p){if(ch==="x"||ch==="y"){const n=Math.floor(Math.random()*16);r+=(ch==="y"?(n&0x3)|0x8:n).toString(16)}else r+=ch}return r}
function getRandomChars(n=16){const c="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";let r="";for(let i=0;i<n;i++)r+=c.charAt(Math.floor(Math.random()*c.length));return r}
function toQuery(p={}){return Object.keys(p).filter(k=>p[k]!==undefined&&p[k]!==null).sort().map(k=>k+"="+p[k]).join("&")}
function cleanToken(t){return String(t||"").trim().replace(/^[bB]earer\s+/i,"").replace(/[\s"'`]+/g,"")}
function cleanBarkKey(b){let s=String(b||"").trim().replace(/^[bB]ark\s*(key)?\s*[:：]\s*/i,"").replace(/[\s"'`]+/g,"").trim();return s.replace(/\/+$/,"")}
function maskVin(v){const s=String(v||"");if(!s)return"";if(s.length<=7)return"****";return s.substring(0,3)+"****"+s.substring(s.length-4)}
function deepPick(obj,keys,depth){if(!obj||typeof obj!=="object"||(depth||0)>5)return"";for(const k of keys){if(obj[k]!==undefined&&obj[k]!==null&&obj[k]!=="")return String(obj[k])}for(const k in obj){if(obj[k]&&typeof obj[k]==="object"){const r=deepPick(obj[k],keys,(depth||0)+1);if(r)return r}}return""}
function pickIotProp(d,identify){const arr=d&&d.iotProperties;if(Array.isArray(arr)){const key=String(identify).toLowerCase();for(const it of arr){if(it&&String(it.identify||"").toLowerCase()===key&&it.value!==null&&it.value!==undefined&&it.value!=="")return String(it.value)}}return""}
function getDeviceIdentify(acc){const seed=String(acc.userId||acc.vinNo||"zeeho-device");let h=0;for(let i=0;i<seed.length;i++){h=((h<<5)-h+seed.charCodeAt(i))|0}return(Math.abs(h).toString(16)+"0000000000000000").slice(0,16)}
function hasValidCoord(lat,lng){if(lat===""||lat===null||lat===undefined||lng===""||lng===null||lng===undefined)return false;const la=Number(lat),ln=Number(lng);return isFinite(la)&&isFinite(ln)&&Math.abs(la)<=90&&Math.abs(ln)<=180&&!(la===0&&ln===0)}
function normalizeRefreshSec(v){const n=Number(v);if(!isFinite(n)||n<=0)return 60;return Math.max(15,Math.min(3600,Math.round(n)))}

    '<div class="hc-bar"><div class="hc-fill" style="width:'+Math.max(0,Math.min(100,soc))+'%;background:'+socCol+'"></div></div>'+

function renderVehicleSwitch(v,idx){

async function switchVehicle(idx,vin){
  const src=STATE.data[idx];if(!src||!vin)return;
  try{
    let d;
    if(isProxyMode()){
      const r=await proxyFetch("/api/vehicle?userId="+encodeURIComponent(src.userId||"")+"&vin="+encodeURIComponent(vin));
      d=(r&&r.ok)?r.result:null;
    }else{
      const cfg=getCfg();const acc=getAccounts()[idx];
      if(!acc)return;
      d=await fetchAccountData(acc,cfg,vin);
    }

      STATE.data[idx]=Object.assign({},STATE.data[idx],d);
      renderHome();
    }
  }catch(e){}
}

function mountSigninFab(){

async function runSigninNow(){

  btn.classList.add("busy");btn.querySelector("span").textContent="签到中…";
  toast("正在为全部账号执行签到…","info");
  const d=await Backend.runSignin(null,true);

function calHtml(days,month,userId){
  const ym=month.split("-");const y=Number(ym[0]),m=Number(ym[1]);
  const first=new Date(y,m-1,1).getDay();
  const dim=new Date(y,m,0).getDate();
  const today=new Date();const tStr=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
  let h='<div class="cal-grid">';
  ["日","一","二","三","四","五","六"].forEach(w=>{h+='<div class="cal-wd">'+w+'</div>'});
  for(let i=0;i<first;i++)h+='<div class="cal-d blank"></div>';
  for(let d=1;d<=dim;d++){
    const ds=month+"-"+String(d).padStart(2,"0");
    const entry=days.find(x=>x.createDate===ds);
    const signed=entry&&(entry.signStatue==3||entry.signStatue==5||entry.signStatue==0);
    const isToday=ds===tStr;
    const future=ds>tStr;
    let cls="cal-d"+(signed?" signed":(future?" future":(entry?" miss":"")));
    if(isToday)cls+=" today";
    const clickable=!signed&&!future&&entry;
    h+='<div class="'+cls+'" '+(clickable?'style="cursor:pointer" onclick="supConsume(\''+ds+'\',\''+esc(userId)+'\')"':'')+'>'
      +'<span>'+d+'</span>'
      +'<span class="dot">'+(signed?"✓":(future?"":(entry?"漏":"")))+'</span>'
      +'</div>';
  }
  h+='</div>';
  h+='<div class="hint" style="margin-top:10px">点击「漏」日期使用补签卡补签（需先有补签卡）</div>';
  return h;
}
function flowHtml(list){
  if(!list.length)return '<div style="color:var(--txt3);font-size:12px;padding:8px 0">暂无流水记录</div>';
  return list.map(x=>{
    const sc=Number(x.integralScore)||0;
    return '<div class="flow-item"><div><div class="nm">'+esc(x.name||"积分变动")+'</div><div class="tm">'+esc(x.myDateStr||x.createDateStr||"")+'</div></div><div class="sc num '+(sc>=0?"plus":"minus")+'">'+(sc>=0?"+":"")+sc+'</div></div>';
  }).join("");
}
async function ptMoreFlow(){
  const list=ptAccounts();const acc=list[PT.accIdx];if(!acc||!acc.userId)return;
  PT.flowPage=(PT.flowPage||1)+1;
  const it=await Backend.integral(acc.userId,PT.flowPage);
  const el=document.getElementById("ptFlow");
  if(el&&it&&Array.isArray(it.detail)&&it.detail.length)el.innerHTML+=flowHtml(it.detail);
  else toast("没有更多了","info");
}
function ptMonthShift(dir){
  const cur=PT.month||new Date().getFullYear()+"-"+String(new Date().getMonth()+1).padStart(2,"0");
  const ym=cur.split("-");let y=Number(ym[0]),m=Number(ym[1])+dir;
  if(m<1){m=12;y--}if(m>12){m=1;y++}
  PT.month=y+"-"+String(m).padStart(2,"0");
  renderPoints();
}
async function supConsume(date,userId){

    else toast("补签失败："+((d&&(d.message||d.error))||"未知"),"err");

}

/* ================= v2.14.9 车辆页（监控 + 车控扩展 + 信息中心） ================= */
let VH={accIdx:0,vin:"",cp:"",gear:"",lockType:"1"};
async function renderVehiclePage(){
  const el=document.getElementById("pageVehicle");if(!el)return;
  const list=ptAccounts();
  if(!list.length){el.innerHTML='<div class="empty"><h3>暂无账号</h3><p>请先在首页加载数据或在设置页添加账号</p></div>';return}
  if(VH.accIdx>=list.length)VH.accIdx=0;
  const acc=list[VH.accIdx];
  if(!acc.userId){el.innerHTML=accChipsHtml("vh")+'<div class="empty"><h3>该账号缺少用户ID</h3></div>';return}
  el.innerHTML=accChipsHtml("vh")+'<div class="empty" style="padding:40px 20px"><p style="color:var(--txt3)">加载车辆数据中…</p></div>';
  let mon=await Backend.vehicleMonitor(acc.userId,"");
  const vehList=(mon&&Array.isArray(mon.vehicles))?mon.vehicles:[];
  if(VH.vin&&mon&&mon.ok&&mon.snapshot&&mon.snapshot.vin!==VH.vin){
    const mon2=await Backend.vehicleMonitor(acc.userId,VH.vin);
    if(mon2&&mon2.ok){mon2.vehicles=vehList;mon=mon2}
  }
  const [opts,info]=await Promise.all([
    Backend.vehicleControlExt({action:"options",userId:acc.userId,vin:VH.vin||""}),
    Backend.infoCenter(acc.userId,VH.vin||"")
  ]);
  let html=accChipsHtml("vh");
  // 车辆选择（多车）
  if(vehList.length>1){
    const curVin=VH.vin||(mon&&mon.snapshot?mon.snapshot.vin:vehList[0].vinNo);
    html+='<div class="opt-row">'+vehList.map(v=>'<button class="opt-chip '+(curVin===v.vinNo?'on':'')+'" onclick="VH.vin=\''+esc(v.vinNo)+'\';renderVehiclePage()">'+esc(v.vehicleName||v.vinNo)+'</button>').join("")+'</div>';
  }
  // 状态监控卡
  html+='<div class="panel-card"><div class="pc-head"><h4>'+I.car+'车辆状态</h4><span style="display:flex;gap:6px"><button class="btn sm" onclick="showVehicleDetail('+VH.accIdx+')">详情</button><button class="btn sm" onclick="renderVehiclePage()">刷新</button></span></div>';
  if(mon&&mon.ok&&mon.snapshot){
    const sn=mon.snapshot;
    const socCol=sn.soc<=20?"var(--err)":sn.soc<=50?"var(--warn)":"var(--ok)";
    html+='<div class="mon-row"><span class="k">剩余电量</span><span class="v num" style="color:'+socCol+'">'+(sn.soc!=null?sn.soc+"%":"--")+'</span></div>';
    html+='<div class="mon-row"><span class="k">剩余续航</span><span class="v num">'+(sn.range!=null?sn.range+" km":"--")+'</span></div>';
    html+='<div class="mon-row"><span class="k">龙头锁</span><span class="v">'+(sn.headLock==="1"?"已锁":"未锁")+'</span></div>';
    html+='<div class="mon-row"><span class="k">在线状态</span><span class="v" style="color:'+(sn.offline?"var(--err)":"var(--ok)")+'">'+(sn.offline?"离线（>30分钟未上报）":"在线")+'</span></div>';
    html+='<div class="mon-row"><span class="k">最后上报</span><span class="v" style="font-size:12px;color:var(--txt2)">'+esc(sn.refreshTime||"--")+'</span></div>';
  }else{
    html+='<div style="color:var(--txt3);font-size:12px">'+esc((mon&&(mon.error||mon.message))||"快照获取失败")+'</div>';
  }
  html+='</div>';
  // 车辆控制卡（从首页迁移过来）
  html+='<div class="panel-card"><div class="pc-head"><h4>'+I.zap+'车辆控制</h4></div>'
    +'<div class="ctrl-grid">'
    +'<button class="ctrl-btn" data-act="find" onclick="ctrlAct('+VH.accIdx+',\'find\',this)">'+I.bell+'寻车</button>'
    +'<button class="ctrl-btn" data-act="loudFind" onclick="ctrlAct('+VH.accIdx+',\'loudFind\',this)">'+I.vol+'鸣笛</button>'
    +'<button class="ctrl-btn" data-act="cushion" onclick="ctrlAct('+VH.accIdx+',\'cushion\',this)">'+I.seat+'坐垫</button>'
    +'<button class="ctrl-btn unlock" data-act="unlock" onclick="ctrlAct('+VH.accIdx+',\'unlock\',this)">'+I.unlock+'开锁</button>'
    +'<button class="ctrl-btn lock" data-act="lock" onclick="ctrlAct('+VH.accIdx+',\'lock\',this)">'+I.lock+'关锁</button>'
    +'</div></div>';
  // 车控扩展卡
  html+='<div class="panel-card"><div class="pc-head"><h4>'+I.zap+'车控扩展</h4></div>';
  const cps=(opts&&Array.isArray(opts.chargePower))?opts.chargePower:[];
  const gears=(opts&&Array.isArray(opts.gears))?opts.gears:[];
  if(cps.length){
    html+='<div style="font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:4px">充电功率（W）</div><div class="opt-row">'
      +cps.map(o=>'<button class="opt-chip '+(VH.cp===o.key?'on':'')+'" onclick="VH.cp=\''+esc(o.key)+'\';renderVehiclePage()">'+esc(o.key)+'</button>').join("")
      +'<button class="btn sm primary" onclick="extSet(\'chargePower\')">设置</button></div>';
  }
  if(gears.length){
    html+='<div style="font-size:12px;font-weight:700;color:var(--txt2);margin-bottom:4px">限速档位（km/h）</div><div class="opt-row">'
      +gears.map(g=>'<button class="opt-chip '+(VH.gear===g?'on':'')+'" onclick="VH.gear=\''+esc(g)+'\';renderVehiclePage()">'+esc(g)+'</button>').join("")
      +'<button class="btn sm primary" onclick="extSet(\'maxSpeed\')">设置</button></div>';
  }
  html+='</div>';
  // 信息中心卡
  html+='<div class="panel-card"><div class="pc-head"><h4>'+I.bell+'信息中心</h4></div>';
  if(info&&info.ok){
    const un=info.unread!=null?deepPick(info.unread,["total","count","unReadCount","num"],3):"";
    if(un!=="")html+='<div class="mon-row"><span class="k">未读消息</span><span class="v num" style="color:var(--brand)">'+esc(un)+'</span></div>';
    const prizes=(info.prizeRecords&&(info.prizeRecords.records||info.prizeRecords.list||info.prizeRecords))||[];
    if(Array.isArray(prizes)&&prizes.length){
      html+='<div style="font-size:12px;font-weight:700;color:var(--txt2);margin:8px 0 4px">盲盒/中奖记录</div>';
      html+=prizes.slice(0,5).map(p=>'<div class="flow-item"><div><div class="nm">'+esc(p.prizesName||p.name||"奖品")+'</div><div class="tm">'+esc(p.createTime||p.createDate||"")+'</div></div><div class="sc plus" style="font-size:12px">'+esc(p.integral?("+"+p.integral):"")+'</div></div>').join("");
    }
    const coupons=(info.coupons&&(info.coupons.records||info.coupons.list||info.coupons))||[];
    if(Array.isArray(coupons)&&coupons.length)html+='<div class="mon-row"><span class="k">优惠券</span><span class="v num">'+coupons.length+' 张</span></div>';
    if(info.ota!=null)html+='<div class="mon-row"><span class="k">OTA 升级</span><span class="v" style="font-size:12px">'+(Array.isArray(info.ota)&&info.ota.length?"有新版本":"已是最新")+'</span></div>';
  }else{
    html+='<div style="color:var(--txt3);font-size:12px">'+esc((info&&(info.error||info.message))||"信息中心加载失败")+'</div>';
  }
  html+='</div>';
  html+='<div class="foot">车控扩展指令经云端下发，响应可能较慢</div>';
  el.innerHTML=html;
}
async function extSet(action){
  const list=ptAccounts();const acc=list[VH.accIdx];if(!acc||!acc.userId)return;
  const body={action:action,userId:acc.userId,vin:VH.vin||""};
  if(action==="chargePower"){if(!VH.cp){toast("请先选择充电功率","err");return}body.value=VH.cp}
  if(action==="maxSpeed"){if(!VH.gear){toast("请先选择限速档位","err");return}body.value=VH.gear}
  toast("指令下发中…","info");
  const d=await Backend.vehicleControlExt(body);
  toast((d&&d.message)||((d&&d.ok)?"指令已下发":"指令失败"),(d&&d.ok)?"ok":"err");
}

function init(){
  applyTheme();mountSigninFab();
  renderCfg();
  if(true){
    STATE.data=DEMO_DATA;STATE.tsText=fmtTime(new Date().toISOString());STATE.proxy=false;
    renderHome();hideSplash();return;
  }
  startAutoRefresh();refreshAll(false);
  // 兜底：极端情况下请求长时间无响应，闪屏也不能一直挡住界面
  setTimeout(hideSplash,12000);
}
init();
