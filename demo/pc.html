<!DOCTYPE html>
<!-- panel-flclash-m3-ui v1.0 · 极核签到面板桌面版 FlClash/Material3 风格单文件 UI -->
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>极核签到面板</title>
<style>
/* ================= 兜底令牌（默认种子 #B7E830，运行时由 JS 重算覆盖） ================= */
:root{
--p0:#000000;--p4:#0a1100;--p6:#0f1700;--p10:#162000;--p12:#192400;--p17:#222f00;--p20:#283600;--p22:#2c3b00;--p24:#304000;--p30:#3c4f00;--p40:#506900;--p50:#658400;--p60:#7ca00d;--p70:#96bb39;--p80:#b0d859;--p90:#ccf476;--p92:#d5f890;--p94:#defba7;--p95:#e2fdb2;--p96:#e7ffbd;--p98:#f3ffdf;--p99:#f9ffef;--p100:#ffffff;
--s0:#000000;--s4:#0c1006;--s6:#111509;--s10:#181e0d;--s12:#1c220f;--s17:#252e14;--s20:#2b3517;--s22:#2f391b;--s24:#343e20;--s30:#414b2d;--s40:#586344;--s50:#717c5c;--s60:#8a9675;--s70:#a4b18f;--s80:#bfcda9;--s90:#dbe9c5;--s92:#e2eecf;--s94:#e9f2d9;--s95:#ecf5de;--s96:#eff7e3;--s98:#f6fced;--s99:#fafef2;--s100:#ffffff;
--t0:#000000;--t4:#001210;--t6:#001815;--t10:#00211e;--t12:#002622;--t17:#00322d;--t20:#003934;--t22:#003e38;--t24:#00433d;--t30:#00534b;--t40:#266b63;--t50:#42857c;--t60:#5c9f96;--t70:#77bab0;--t80:#92d6cc;--t90:#aef2e8;--t92:#bcf6ed;--t94:#caf9f2;--t95:#d1fbf4;--t96:#d8fdf6;--t98:#e9fffb;--t99:#f4fffd;--t100:#ffffff;
--n0:#000000;--n4:#0e0e0d;--n6:#131313;--n10:#1b1c1a;--n12:#1f201e;--n17:#292a28;--n20:#30312f;--n22:#343533;--n24:#393937;--n30:#464745;--n40:#5e5f5c;--n50:#767775;--n60:#90918e;--n70:#aaaca9;--n80:#c6c7c4;--n90:#e2e3e0;--n92:#e8e8e6;--n94:#edeeec;--n95:#f0f1ef;--n96:#f3f4f2;--n98:#f9f9f8;--n99:#fcfcfb;--n100:#ffffff;
--v0:#000000;--v4:#0e0e0d;--v6:#131411;--v10:#1b1c19;--v12:#1f201d;--v17:#292b26;--v20:#2f312c;--v22:#343630;--v24:#383a34;--v30:#454842;--v40:#5d5f59;--v50:#767872;--v60:#8f928b;--v70:#aaaca6;--v80:#c5c8c1;--v90:#e1e4dc;--v92:#e7e9e3;--v94:#edefea;--v95:#f0f1ed;--v96:#f3f4f0;--v98:#f9faf7;--v99:#fcfdfa;--v100:#ffffff;
/* 固定 error / warning 色调板（不随种子变化） */
--e0:#000000;--e10:#410e0b;--e20:#601410;--e30:#8c1d18;--e40:#b3261e;--e50:#dc362e;--e60:#e46962;--e70:#ec9290;--e80:#f2b8b5;--e90:#f9dedc;--e95:#fceeee;--e99:#fffbff;--e100:#ffffff;
--w10:#3e2600;--w20:#5a3b00;--w30:#775000;--w40:#966800;--w80:#ffb95d;--w90:#ffdfae;--w100:#ffffff;
}
/* ================= 角色映射（切主题只换映射，调色板零重算） ================= */
:root[data-theme=light]{
--primary:var(--p40);--on-primary:var(--p100);--primary-container:var(--p90);--on-primary-container:var(--p10);
--secondary:var(--s40);--on-secondary:var(--s100);--secondary-container:var(--s90);--on-secondary-container:var(--s10);
--tertiary:var(--t40);--on-tertiary:var(--t100);--tertiary-container:var(--t90);--on-tertiary-container:var(--t10);
--error:var(--e40);--on-error:var(--e100);--error-container:var(--e90);--on-error-container:var(--e10);
--warn:var(--w40);--on-warn:var(--w100);
--background:var(--n98);--on-background:var(--n10);
--surface:var(--n98);--on-surface:var(--n10);
--surface-variant:var(--v90);--on-surface-variant:var(--v30);
--surface-container-lowest:var(--n100);--surface-container-low:var(--n96);--surface-container:var(--n94);--surface-container-high:var(--n92);--surface-container-highest:var(--n90);
--outline:var(--v50);--outline-variant:var(--v80);
--inverse-surface:var(--n20);--inverse-on-surface:var(--n95);--inverse-primary:var(--p80);
--state-layer:rgba(0,0,0,.06);--state-layer-strong:rgba(0,0,0,.12);
}
:root[data-theme=dark]{
--primary:var(--p80);--on-primary:var(--p20);--primary-container:var(--p30);--on-primary-container:var(--p90);
--secondary:var(--s80);--on-secondary:var(--s20);--secondary-container:var(--s30);--on-secondary-container:var(--s90);
--tertiary:var(--t80);--on-tertiary:var(--t20);--tertiary-container:var(--t30);--on-tertiary-container:var(--t90);
--error:var(--e80);--on-error:var(--e20);--error-container:var(--e30);--on-error-container:var(--e90);
--warn:var(--w80);--on-warn:var(--w20);
--background:var(--n6);--on-background:var(--n90);
--surface:var(--n6);--on-surface:var(--n90);
--surface-variant:var(--v30);--on-surface-variant:var(--v80);
--surface-container-lowest:var(--n4);--surface-container-low:var(--n10);--surface-container:var(--n12);--surface-container-high:var(--n17);--surface-container-highest:var(--n22);
--outline:var(--v60);--outline-variant:var(--v30);
--inverse-surface:var(--n90);--inverse-on-surface:var(--n20);--inverse-primary:var(--p40);
--state-layer:rgba(255,255,255,.08);--state-layer-strong:rgba(255,255,255,.14);
}
/* ================= 基础 ================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--background);color:var(--on-surface);font-size:14px;overflow:hidden;display:flex;flex-direction:column}
svg{display:block}
a{color:var(--primary)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--outline) 45%,transparent);border-radius:5px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.num{font-variant-numeric:tabular-nums}
/* ================= 标题栏 ================= */
#titlebar{height:40px;flex:none;display:flex;align-items:center;-webkit-app-region:drag;background:var(--surface-container-high);user-select:none;z-index:20}
.tb-brand{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;font-weight:600;color:var(--on-surface-variant);min-width:0}
.tb-brand svg{width:18px;height:18px;fill:var(--primary)}
.tb-brand .sub{font-weight:400;font-size:11px;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-btns{margin-left:auto;display:flex;-webkit-app-region:no-drag;height:100%}
.tb-btn{width:44px;height:40px;display:grid;place-items:center;border:0;background:transparent;color:var(--on-surface-variant);cursor:pointer;position:relative;overflow:hidden}
.tb-btn svg{width:14px;height:14px;fill:currentColor}
.tb-btn:hover{background:var(--state-layer)}
.tb-btn.danger:hover{background:var(--error);color:var(--on-error)}
.demo-badge{margin-left:10px;font-size:11px;font-weight:600;color:var(--on-secondary-container);background:var(--secondary-container);padding:2px 10px;border-radius:999px;-webkit-app-region:no-drag}
/* ================= 壳 / rail ================= */
#shell{display:flex;flex:1;min-height:0}
#rail{width:84px;flex:none;background:var(--surface-container);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:2px;overflow-y:auto;overflow-x:hidden}
.rail-dest{position:relative;width:100%;height:66px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:0;background:transparent;color:var(--on-surface-variant);cursor:pointer;font-size:11px;overflow:hidden}
.rail-pill{position:absolute;top:10px;left:50%;width:56px;height:32px;margin-left:-28px;border-radius:16px;background:var(--secondary-container);transform:scaleX(.4);opacity:0;transition:transform .32s cubic-bezier(.34,1.56,.64,1),opacity .18s ease}
.rail-dest.on .rail-pill{transform:scaleX(1);opacity:1}
.rail-dest:hover .rail-pill{opacity:.55}
.rail-dest.on:hover .rail-pill{opacity:1}
.rail-dest.on{color:var(--on-secondary-container)}
.rail-dest svg{position:relative;z-index:1;width:24px;height:24px;fill:currentColor}
.rail-label{position:relative;z-index:1;line-height:1;font-weight:500}
@media (max-width:900px){#rail{width:56px}.rail-label{display:none}.rail-dest{height:56px}}
/* ================= 内容区 ================= */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
.page-header{height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px}
.page-header h1{font-size:20px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-header .ts{font-size:11.5px;color:var(--on-surface-variant);font-weight:400;margin-left:8px}
#views{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 28px}
.view{display:none}
.view.on{display:block;animation:fadeUp .3s cubic-bezier(.2,0,0,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ================= 组件：卡片 ================= */
.card{background:var(--surface-container-low);border-radius:16px;padding:16px;margin-bottom:12px}
.card.hi{background:var(--surface-container)}
.card.flat{background:var(--surface-container-lowest)}
.card-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-bottom:10px;color:var(--on-surface)}
.card-title>svg{width:18px;height:18px;fill:var(--primary);flex:none}
.card-title .sp{flex:1}
.card-title .hint2{font-size:11px;font-weight:400;color:var(--on-surface-variant)}
/* ================= 组件：按钮 ================= */
.btn{position:relative;overflow:hidden;height:36px;padding:0 20px;border-radius:18px;border:0;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:var(--on-primary);font-family:inherit;flex:none;transition:box-shadow .2s,background .2s}
.btn:hover{box-shadow:0 1px 4px rgba(0,0,0,.25)}
.btn:disabled{background:color-mix(in srgb,var(--on-surface) 12%,transparent);color:color-mix(in srgb,var(--on-surface) 38%,transparent);cursor:default;box-shadow:none}
.btn svg{width:16px;height:16px;fill:currentColor;flex:none}
.btn.outlined{background:transparent;color:var(--primary);border:1px solid var(--outline)}
.btn.outlined:hover{background:color-mix(in srgb,var(--primary) 8%,transparent);box-shadow:none}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.text{background:transparent;color:var(--primary);padding:0 14px}
.btn.text:hover{background:color-mix(in srgb,var(--primary) 8%,transparent);box-shadow:none}
.btn.danger{background:var(--error);color:var(--on-error)}
.btn.danger-outlined{background:transparent;color:var(--error);border:1px solid var(--error)}
.btn.sm{height:28px;padding:0 14px;border-radius:14px;font-size:12px}
.btn.sm svg{width:14px;height:14px}
.icon-btn{position:relative;overflow:hidden;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--on-surface-variant);cursor:pointer;display:inline-grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--state-layer)}
.icon-btn svg{width:18px;height:18px;fill:currentColor}
/* ================= 组件：开关 ================= */
.switch{position:relative;width:52px;height:32px;flex:none;border-radius:16px;border:2px solid var(--outline);background:var(--surface-container-highest);cursor:pointer;transition:background .2s,border-color .2s;display:inline-block}
.switch::after{content:"";position:absolute;left:calc(50% - 20px);top:50%;width:14px;height:14px;border-radius:50%;background:var(--outline);transform:translateY(-50%);transition:all .28s cubic-bezier(.34,1.56,.64,1)}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{left:calc(50% - 14px);width:20px;height:20px;background:var(--on-primary)}
/* ================= 组件：分段按钮 ================= */
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:18px;overflow:hidden;flex:none}
.seg button{height:34px;padding:0 16px;border:0;border-right:1px solid var(--outline);background:transparent;color:var(--on-surface);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;position:relative;overflow:hidden}
.seg button:last-child{border-right:0}
.seg button svg{width:15px;height:15px;fill:currentColor}
.seg button.on{background:var(--secondary-container);color:var(--on-secondary-container);font-weight:600}
/* ================= 组件：chip ================= */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{position:relative;overflow:hidden;height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--outline-variant);background:transparent;color:var(--on-surface-variant);font-size:13px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--secondary-container);border-color:transparent;color:var(--on-secondary-container);font-weight:600}
.chip svg{width:15px;height:15px;fill:currentColor}
/* ================= 组件：对话框 ================= */
#dialoghost{position:fixed;inset:0;z-index:100;pointer-events:none}
#dialoghost.has{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .22s}
.scrim.in{opacity:1}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.88);opacity:0;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .2s;background:var(--surface-container-high);border-radius:28px;padding:24px;width:min(480px,92%);max-height:84vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.dlg.in{transform:translate(-50%,-50%) scale(1);opacity:1}
.dlg.wide{width:min(760px,94%)}
.dlg h2{font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px}
.dlg h2 svg{width:22px;height:22px;fill:var(--primary)}
.dlg .dbody{overflow-y:auto;flex:1;min-height:0;margin:10px 0;color:var(--on-surface-variant);font-size:13px;line-height:1.65}
.dlg .dacts{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
/* ================= 组件：snackbar ================= */
#snackhost{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.snackbar{background:var(--inverse-surface);color:var(--inverse-on-surface);padding:11px 22px;border-radius:9px;font-size:13px;opacity:0;transform:translateY(14px);transition:all .28s cubic-bezier(.2,0,0,1);box-shadow:0 3px 14px rgba(0,0,0,.3);max-width:74vw;pointer-events:auto}
.snackbar.in{opacity:1;transform:none}
.snackbar.ok{background:var(--primary-container);color:var(--on-primary-container)}
.snackbar.err{background:var(--error-container);color:var(--on-error-container)}
/* ================= 组件：ripple ================= */
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* ================= 组件：骨架屏 ================= */
.sk{position:relative;overflow:hidden;background:color-mix(in srgb,var(--on-surface) 8%,transparent);border-radius:8px}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--on-surface) 7%,transparent),transparent);animation:shim 1.5s infinite}
@keyframes shim{to{transform:translateX(100%)}}
.sk-card{height:130px;border-radius:16px;margin-bottom:12px}
.sk-line{height:14px;margin:8px 0}
.load-hint{margin-top:16px;text-align:center;font-size:13px;color:var(--on-surface-variant)}
/* ================= 组件：空状态 ================= */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:64px 20px;color:var(--on-surface-variant);text-align:center}
.empty>svg{width:46px;height:46px;fill:var(--primary);opacity:.75}
.empty h3{font-size:16px;color:var(--on-surface);font-weight:600}
.empty p{font-size:12.5px;max-width:420px;line-height:1.7}
.empty .btns{display:flex;gap:8px;margin-top:6px}
/* ================= 设置列表行 ================= */
.lrow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px}
.lrow+.lrow{margin-top:2px}
.lrow.act{cursor:pointer;position:relative;overflow:hidden}
.lrow.act:hover{background:var(--state-layer)}
/* 全局 SVG 基线：ic() 生成的图标一律 20px，带类选择器的专项规则按特异性覆盖；
   杜绝裸拼 SVG 无约束撑爆布局（此前 .lrow>svg、.trk .dh、.ride .chev 出过同类 bug） */
svg{width:20px;height:20px;flex:none}
.lrow .ic{width:22px;flex:none;display:grid;place-items:center;color:var(--on-surface-variant)}
.lrow .ic svg{width:20px;height:20px;fill:currentColor}
.lrow>svg{fill:var(--on-surface-variant)}
.lrow .tt{flex:1;min-width:0}
.lrow .tt b{font-weight:500;font-size:13.5px;display:block;color:var(--on-surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .tt span{font-size:11.5px;color:var(--on-surface-variant);display:block;margin-top:2px;line-height:1.5}
/* ================= 表单 ================= */
.field{display:flex;flex-direction:column;gap:4px;margin:9px 0}
.field label{font-size:11.5px;color:var(--on-surface-variant);font-weight:500}
.field input,.field textarea,.field select{background:var(--surface);border:1px solid var(--outline);border-radius:8px;color:var(--on-surface);padding:8px 10px;font-size:13px;font-family:inherit;width:100%}
.field textarea{resize:vertical;min-height:64px;font-family:Consolas,"Cascadia Mono",monospace;font-size:12px}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--primary);outline-offset:-1px}
.frow{display:flex;gap:10px;flex-wrap:wrap}
.frow>.field{flex:1;min-width:140px}
/* ================= 统计 / 键值 ================= */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:980px){.grid4{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface-container-low);border-radius:14px;padding:12px 14px}
.stat .lb{font-size:11px;color:var(--on-surface-variant)}
.stat .vl{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px;line-height:1.2}
.stat .vl small{font-size:12px;font-weight:400;color:var(--on-surface-variant)}
.stat.acc{background:var(--primary-container);color:var(--on-primary-container)}
.stat.acc .lb{color:inherit;opacity:.8}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:6px 2px;border-bottom:1px dashed color-mix(in srgb,var(--outline-variant) 60%,transparent)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--on-surface-variant);flex:none}
.kv .v{font-weight:500;font-variant-numeric:tabular-nums;text-align:right;min-width:0;white-space:normal;word-break:break-word}
/* ================= 电池条 / 签到点 ================= */
.batt{height:8px;border-radius:4px;background:color-mix(in srgb,var(--on-surface) 12%,transparent);overflow:hidden;margin:8px 0}
.batt>i{display:block;height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,0,0,1)}
.dots{display:flex;gap:6px;margin:10px 0 4px}
.dot7{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;background:color-mix(in srgb,var(--on-surface) 8%,transparent);color:var(--on-surface-variant);flex:none}
.dot7.s{background:var(--primary);color:var(--on-primary)}
.dot7.t{box-shadow:0 0 0 2px var(--primary)}
/* ================= 徽标 ================= */
.badge{font-size:10.5px;padding:2px 9px;border-radius:10px;background:var(--secondary-container);color:var(--on-secondary-container);font-weight:600;flex:none}
.badge.err{background:var(--error-container);color:var(--on-error-container)}
.badge.ok{background:var(--primary-container);color:var(--on-primary-container)}
.badge.chg{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.badge.warn{background:var(--w90);color:var(--w20)}
:root[data-theme=dark] .badge.warn{background:var(--w30);color:var(--w90)}
/* ================= 控制钮 ================= */
.ctrl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ctrl button{position:relative;overflow:hidden;aspect-ratio:1.15;border-radius:16px;border:0;background:var(--surface-container-high);color:var(--on-surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;cursor:pointer;font-family:inherit}
.ctrl button:hover{background:var(--surface-container-highest)}
.ctrl button svg{width:22px;height:22px;fill:currentColor}
.ctrl button.warn{background:var(--error-container);color:var(--on-error-container)}
.ctrl button.warn:hover{background:color-mix(in srgb,var(--error) 24%,var(--error-container))}
.ctrl button:disabled{opacity:.5;cursor:default}
@media (max-width:860px){.ctrl{grid-template-columns:repeat(3,1fr)}}
/* ================= 流水列表 ================= */
.flow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid color-mix(in srgb,var(--outline-variant) 55%,transparent)}
.flow:last-child{border-bottom:0}
.flow .nm{flex:1;min-width:0}
.flow .nm b{font-weight:500;font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--on-surface)}
.flow .nm span{font-size:11px;color:var(--on-surface-variant)}
.flow .sc{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;flex:none}
.flow .sc.plus{color:var(--primary)}
.flow .sc.minus{color:var(--error)}
/* ================= 日志 ================= */
.log{padding:10px 12px;border-radius:12px;background:var(--surface-container-low);margin-bottom:8px}
.log .h{display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:4px;flex-wrap:wrap}
.log .h .t{font-family:Consolas,"Cascadia Mono",monospace;color:var(--on-surface-variant);font-size:11.5px}
.log .h .u{font-weight:600;color:var(--on-surface)}
.log pre{font-family:Consolas,"Cascadia Mono",monospace;font-size:11.5px;white-space:pre-wrap;word-break:break-all;color:var(--on-surface-variant);line-height:1.55;margin-top:4px}
.log pre .fail{color:var(--error)}
/* ================= 日历 ================= */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:11px;color:var(--on-surface-variant);padding:2px 0}
.cal .d{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;background:color-mix(in srgb,var(--on-surface) 6%,transparent);color:var(--on-surface-variant);position:relative;overflow:hidden}
.cal .d.signed{background:var(--primary-container);color:var(--on-primary-container)}
.cal .d.miss{background:var(--error-container);color:var(--on-error-container);cursor:pointer}
.cal .d.miss:hover{filter:brightness(.94)}
.cal .d.future{opacity:.35}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--primary)}
.cal .d i{font-style:normal;font-size:9px;line-height:1}
.cal .d.blank{background:transparent}
/* ================= 种子色 swatch ================= */
.sw-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw.on{border-color:var(--on-surface)}
.sw.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--surface);text-shadow:0 0 3px rgba(0,0,0,.6)}
/* ================= 签到结果卡 ================= */
.sig{border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--surface-container);border-left:4px solid var(--primary)}
.sig.fail{border-left-color:var(--error)}
.sig .h{display:flex;justify-content:space-between;font-weight:600;font-size:13px;margin-bottom:4px}
.sig .st{font-size:11.5px;color:var(--on-surface-variant);line-height:1.7;font-family:Consolas,"Cascadia Mono",monospace;white-space:pre-wrap}
.sig .er{font-size:11.5px;color:var(--error);margin-top:3px}
/* ================= 轨迹卡 ================= */
.trk{border-radius:14px;background:var(--surface-container-low);padding:12px 14px;margin-bottom:10px}
.trk .dh{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px}
.trk .dh .sp{flex:1}
.trk .dh .km{color:var(--primary);font-variant-numeric:tabular-nums}
.ride{padding:8px 2px;border-top:1px dashed color-mix(in srgb,var(--outline-variant) 60%,transparent);cursor:pointer}
.ride .r1{display:flex;gap:8px;align-items:center;font-size:12.5px}
.ride .r1 .tm{color:var(--on-surface-variant);font-variant-numeric:tabular-nums;flex:none;font-size:11.5px}
.ride .r1 .ad{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ride .r1 .km{flex:none;font-weight:600;color:var(--primary);font-variant-numeric:tabular-nums}
.ride .r2{display:none;font-size:11.5px;color:var(--on-surface-variant);margin-top:6px;line-height:1.8}
.ride.open .r2{display:block}
.ride .chev{transition:transform .2s;flex:none}
.ride.open .chev{transform:rotate(90deg)}
/* ================= 杂项 ================= */
.hint{font-size:11px;color:var(--on-surface-variant);line-height:1.6;margin-top:8px}
.muted{color:var(--on-surface-variant)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mb8{margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.foot{font-size:11px;color:var(--on-surface-variant);text-align:center;padding:10px 0 2px;line-height:1.8}
.blind{margin-bottom:10px}
.blind .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;color:var(--on-surface-variant)}
.blind .top .r{font-variant-numeric:tabular-nums}
.blind .bar{height:8px;border-radius:4px;background:color-mix(in srgb,var(--on-surface) 12%,transparent);overflow:hidden}
.blind .bar>i{display:block;height:100%;background:var(--tertiary);border-radius:4px;transition:width .5s}

/* ================= Material You 动态色（OKLCH 近似 M3 色调板） ================= */
function hexToRgb01(h){h=String(h).replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);if(!isFinite(n))return[0,0,0];return[((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255];}
function s2l(c){return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}
function l2s(c){return c<=0.0031308?c*12.92:1.055*Math.pow(c,1/2.4)-0.055;}
function rgbToOklch(rgb){
  const lr=rgb.map(s2l);
  const l=Math.cbrt(0.4122214708*lr[0]+0.5363325363*lr[1]+0.0514459929*lr[2]);
  const m=Math.cbrt(0.2119034982*lr[0]+0.6806995451*lr[1]+0.1073969566*lr[2]);
  const s=Math.cbrt(0.0883024619*lr[0]+0.2817188376*lr[1]+0.6299787005*lr[2]);
  const L=0.2104542553*l+0.7936177850*m-0.0040720468*s;
  const a=1.9779984951*l-2.4285922050*m+0.4505937099*s;
  const b=0.0259040371*l+0.7827717662*m-0.8086757660*s;
  let H=Math.atan2(b,a)*180/Math.PI;if(H<0)H+=360;
  return[L,Math.hypot(a,b),H];
}
function oklchToLin(L,C,Hdeg){
  const a=C*Math.cos(Hdeg*Math.PI/180),b=C*Math.sin(Hdeg*Math.PI/180);
  const l=Math.pow(L+0.3963377774*a+0.2158037731*b,3);
  const m=Math.pow(L-0.1055613458*a-0.0638541728*b,3);
  const s=Math.pow(L-0.0894841775*a-1.2914855480*b,3);
  return[4.0767416621*l-3.3077115992*m+0.2309699277*s,

}
function inGamut(rgb){return rgb.every(c=>c>=-0.0001&&c<=1.0001);}

  if(inGamut(oklchToLin(L,C,H)))return C;
  let lo=0,hi=C;
  for(let i=0;i<24;i++){const mid=(lo+hi)/2;if(inGamut(oklchToLin(L,mid,H)))lo=mid;else hi=mid;}
  return lo;
}
function toneToL(t){return t<=0?0:t>=100?1:Math.cbrt(t>7.999?Math.pow((t+16)/116,3):t/903.3);}

  C=fitGamut(L,C,H);
  const v=oklchToLin(L,C,H).map(c=>Math.round(l2s(Math.min(1,Math.max(0,c)))*255));
  return"#"+v.map(x=>x.toString(16).padStart(2,"0")).join("");

const TONES=[0,4,6,10,12,17,20,22,24,30,40,50,60,70,80,90,92,94,95,96,98,99,100];

  const out={};
  for(const t of TONES)out[prefix+t]=toneHex(toneToL(t),chromaAt(chroma,t),hue);

function schemeFromSeed(seed){
  const[L,C,H]=rgbToOklch(hexToRgb01(seed));

  return Object.assign({},
    buildTonalPalette(H,pc,"p"),
    buildTonalPalette(H,0.05,"s"),
    buildTonalPalette((H+60)%360,0.07,"t"),
    buildTonalPalette(H,0.004,"n"),

}

function deepMergeInplace(t,s){for(const k in s){if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])){t[k]=t[k]||{};deepMergeInplace(t[k],s[k]);}else t[k]=s[k];}}
const _apiReal=api,_postReal=postJSON;
api=function(path,opts){if(!DEMO)return _apiReal(path,opts);return demoCall("GET",path,null);};
postJSON=function(path,body){if(!DEMO)return _postReal(path,body);return demoCall("POST",path,body);};
async function demoCall(m,u,b){await new Promise(r=>setTimeout(r,140+Math.random()*260));try{return demoHandle(m,u,b)||{ok:false,error:"演示模式：无数据"};}catch(e){return {ok:false,error:"演示异常："+String(e&&e.message||e)};}}
function deepMerge(base,patch){
  if(!patch||typeof patch!=="object")return base;
  const out=Array.isArray(base)?base.slice():Object.assign({},base);
  for(const k in patch){
    const pv=patch[k],bv=out[k];
    if(pv&&typeof pv==="object"&&!Array.isArray(pv)&&bv&&typeof bv==="object"&&!Array.isArray(bv))out[k]=deepMerge(bv,pv);
    else out[k]=pv;
  }
  return out;
}

/* ================= snackbar 队列 ================= */
const snackQ=[];let snackBusy=false;
function snack(msg,kind){
  snackQ.push({msg:msg,kind:kind||""});
  if(!snackBusy)nextSnack();
}
function nextSnack(){
  if(!snackQ.length){snackBusy=false;return;}
  snackBusy=true;
  const it=snackQ.shift();
  const el=document.createElement("div");
  el.className="snackbar"+(it.kind?" "+it.kind:"");
  el.textContent=it.msg;
  $("#snackhost").appendChild(el);
  requestAnimationFrame(()=>el.classList.add("in"));
  setTimeout(()=>{
    el.classList.remove("in");
    setTimeout(()=>{el.remove();nextSnack();},300);
  },4000);
}

/* ================= 对话框（栈式，scale .88→1 弹性） ================= */
const dlgStack=[];
function openDialog(opt){
  const host=$("#dialoghost");
  host.classList.add("has");
  const scrim=document.createElement("div");scrim.className="scrim";
  const card=document.createElement("div");card.className="dlg"+(opt.wide?" wide":"");
  card.innerHTML=(opt.title?'<h2>'+(opt.icon?ic(opt.icon):"")+esc(opt.title)+"</h2>":"")
    +'<div class="dbody">'+(opt.body||"")+'</div>'
    +'<div class="dacts"></div>';
  const acts=card.querySelector(".dacts");
  (opt.actions||[{label:"关闭"}]).forEach(a=>{
    const b=document.createElement("button");
    b.className="btn "+(a.variant||"text");
    b.textContent=a.label;
    b.onclick=()=>{if(a.keep){if(a.onClick)a.onClick(card);}else{closeDialog(entry);if(a.onClick)a.onClick();}};
    acts.appendChild(b);
  });
  host.appendChild(scrim);host.appendChild(card);
  const entry={scrim:scrim,card:card};
  dlgStack.push(entry);
  requestAnimationFrame(()=>{scrim.classList.add("in");card.classList.add("in");});
  scrim.onclick=()=>{if(dlgStack[dlgStack.length-1]===entry)closeDialog(entry);};
  if(opt.onOpen)opt.onOpen(card);
  return entry;
}
function closeDialog(entry){
  const i=dlgStack.indexOf(entry);
  if(i>=0)dlgStack.splice(i,1);
  entry.scrim.classList.remove("in");entry.card.classList.remove("in");
  setTimeout(()=>{
    entry.scrim.remove();entry.card.remove();
    if(!dlgStack.length)$("#dialoghost").classList.remove("has");
  },260);
}
function closeAllDialogs(){while(dlgStack.length)closeDialog(dlgStack[dlgStack.length-1]);}
function confirmDialog(title,text,onYes,yesLabel,danger){
  openDialog({title:title,icon:danger?"alert":"info",body:"<div>"+esc(text)+"</div>",
    actions:[{label:"取消",variant:"text"},{label:yesLabel||"确定",variant:danger?"danger":"filled",onClick:onYes}]});
}

/* ================= ripple ================= */
document.addEventListener("pointerdown",e=>{
  const host=e.target.closest(".btn,.icon-btn,.chip,.rail-dest,.seg button,.lrow.act,.tb-btn,.ctrl button,.sw");
  if(!host||host.disabled)return;
  const r=host.getBoundingClientRect();
  const d=Math.max(r.width,r.height)*2;
  const sp=document.createElement("span");
  sp.className="ripple";
  sp.style.width=sp.style.height=d+"px";
  sp.style.left=(e.clientX-r.left-d/2)+"px";
  sp.style.top=(e.clientY-r.top-d/2)+"px";
  host.appendChild(sp);
  setTimeout(()=>sp.remove(),600);
});

function startTimers(id){
  if(id==="logs")S.timers.logs=setInterval(()=>{if(S.view==="logs")loadLogs("silent");},30000);
  if(id==="vehicle")S.timers.vehicle=setInterval(()=>{if(S.view==="vehicle")vehiclePoll();},30000);
  /* 数据自动刷新：与移动端 autoRefreshSec 对齐（默认 60s），静默重拉当前视图数据，解决"数据停留在打开时刻"的问题 */
  const arsec=Math.max(15,Math.min(3600,num((S.CFG&&S.CFG.config&&S.CFG.config.autoRefreshSec)||60)));
  const loader=({home:()=>loadHome("keep"),points:()=>loadPoints("silent"),ride:()=>loadRide("silent")})[id];
  if(loader)S.timers.data=setInterval(()=>{if(S.view===id&&!S.signinBusy)loader();},arsec*1000);
}

async function loadHome(mode){

function homeCardHtml(a,idx){
  const v=a.vehicle||{};

  if(bound(v.frontPressure)||bound(v.rearPressure))rows.push("胎压："+(bound(v.frontPressure)?"前 "+esc(v.frontPressure):"")+((bound(v.frontPressure)&&bound(v.rearPressure))?" / ":"")+(bound(v.rearPressure)?"后 "+esc(v.rearPressure):"")+(bound(v.frontTemp)?"（"+esc(v.frontTemp)+"）":""));
  if(isCharging&&num(v.current))rows.push("充电电流 <b class=\"num\">"+num(v.current).toFixed(1)+"A</b> · 电压 <b class=\"num\">"+num(v.voltage).toFixed(1)+"V</b>");
  const dots=(a.last7||[]).map(x=>'<span class="dot7'+(x.signed?" s":"")+(x.isToday?" t":"")+'" title="'+esc(x.date)+'">'+esc(String(x.date).replace(/^\d+-/,""))+"</span>").join("");
  let img="";
  if(v.hasVehicle&&v.vehicleImageUrl)img='<img src="'+esc(v.vehicleImageUrl)+'" alt="" style="max-width:190px;width:42%;border-radius:12px;object-fit:cover" onerror="this.remove()">';
  const vehSw=(v.vehicles&&v.vehicles.length>1)?'<div class="row" style="margin-top:10px"><span class="muted" style="font-size:11px">车辆</span>'+v.vehicles.map(x=>'<button class="chip'+((v.currentVin||v.vinNo)===x.vinNo?" on":"")+'" data-vswitch="'+idx+'" data-vin="'+esc(x.vinNo)+'">'+esc(x.name||x.vinNo)+"</button>").join("")+"</div>":"";
  return '<div class="card hi">'
    +'<div class="card-title">'+ic("scooter")+'<span>'+esc(v.hasVehicle?(v.vehicleName||a.userName):a.userName)+"</span>"
    +(onl==="在线"?'<span class="badge ok">在线</span>':(onl?'<span class="badge">'+esc(onl)+"</span>":""))
    +(isCharging?'<span class="badge chg">充电中</span>':"")
    +(a.tokenValid===false?'<span class="badge err">Token 失效</span>':"")
    +'<span class="sp"></span>'
    +(a.signedToday?'<span class="badge ok">✓ 今日已签到</span>':'<button class="btn sm" data-signin="'+esc(a.userId)+'">签到</button>')
    +"</div>"
    +(v.hasVehicle
      ?'<div class="row" style="align-items:flex-start;gap:16px"><div style="flex:1;min-width:200px">'
       +'<div style="display:flex;align-items:baseline;gap:10px"><span class="num" style="font-size:30px;font-weight:700;color:'+socColor(soc)+'">'+Math.round(soc)+'%</span>'
       +'<span class="num muted">'+num(v.residualRangeKm)+' km</span>'
       +(num(v.voltage)?'<span class="num muted">'+Math.round(num(v.voltage))+"V</span>":"")+"</div>"
       +'<div class="batt"><i style="width:'+Math.max(0,Math.min(100,soc))+'%;background:'+socColor(soc)+'"></i></div>'
       +'<div class="dots">'+dots+"</div>"
       +'<div class="hint">'+rows.join("<br>")+"</div></div>"
       +(img?'<div>'+img+"</div>":"")
       +"</div>"
      :'<div class="dots">'+dots+'</div><div class="hint">该账号未绑定车辆</div>')
    +'<div class="row mt8" style="gap:14px;font-size:12.5px"><span>总积分 <b class="num" style="color:var(--primary)">'+num(a.score).toLocaleString()+"</b></span>"

    +'<span>连签 <b class="num">'+num(a.continueDays)+" 天</b></span>"

async function switchVehicleHome(idx,vin){
  const src=S.data[idx];if(!src||!vin)return;
  const r=await api("/api/vehicle?userId="+encodeURIComponent(src.userId)+"&vin="+encodeURIComponent(vin));
  if(r&&r.ok&&r.result&&r.result.vehicle&&r.result.vehicle.hasVehicle){
    S.data[idx]=Object.assign({},S.data[idx],r.result);
    renderHome();
  }else snack("切换车辆失败："+((r&&(r.error||r.message))||"未知"),"err");
}
function signinResultHtml(results){
  return(results||[]).map(r=>'<div class="sig'+(r.success?"":" fail")+'"><div class="h"><span>'+esc(r.userName||"未知")+"</span><span>"+(r.success?("+"+num(r.totalGain||0)+" 分"):"失败")+"</span></div>"
    +'<div class="st">'+(r.steps||[]).map(s=>esc(s)).join("\n")+"</div>"
    +(r.error?'<div class="er">'+esc(r.error)+"</div>":"")+"</div>").join("");
}
async function doSignin(userId,btn){
  if(S.signinBusy){snack("签到正在执行中…","");return;}
  if(!userId&&!S.data.length){snack("暂无账号","err");return;}
  S.signinBusy=true;
  if(btn){btn.disabled=true;btn.textContent="执行中…";}
  const all=$("#btnSignAll");
  if(!userId&&all){all.disabled=true;all.textContent="执行中…";}
  const d=await postJSON("/api/run-signin",userId?{userId:userId}:{all:true});
  S.signinBusy=false;
  if(d&&d.ok&&Array.isArray(d.results)){
    const okN=d.results.filter(r=>r.success).length;
    snack("签到完成："+okN+"/"+d.results.length+" 成功",okN===d.results.length?"ok":"err");
    openDialog({title:"签到结果",icon:"check",body:signinResultHtml(d.results),wide:true});
    await loadHome("keep");
  }else{
    snack("签到执行失败："+((d&&d.error)||"未知"),"err");
    if(btn){btn.disabled=false;btn.textContent="签到";}
    renderHeaderActions(S.view);
  }
  if(all)renderHeaderActions("home");
}

function renderLogs(){
  const el=$("#view-logs");
  const filters=[["all","全部"],["signin","签到"],["vehicle","控车"]];
  const list=S.logs.filter(l=>S.logFilter==="all"||l.type===S.logFilter);
  let h='<div class="chips">'+filters.map(f=>'<button class="chip'+(S.logFilter===f[0]?" on":"")+'" data-logf="'+f[0]+'">'+f[1]+"</button>").join("")
    +'<span class="sp" style="flex:1"></span><span class="muted num" id="logCount" style="align-self:center;font-size:12px">'+list.length+" 条</span></div>";
  if(!list.length)h+=emptyHtml("article","暂无日志","签到与控车操作的运行记录会显示在这里（每 30 秒自动刷新）。");
  else h+=list.map(l=>{
    const isV=l.type==="vehicle";
    const steps=(l.steps||[]).map(s=>/<失败|未解锁|token已失效|已失效/.test(s)?'<span class="fail">'+esc(s)+"</span>":esc(s)).join("\n");
    return '<div class="log"><div class="h">'
      +'<span class="t">'+esc(l.time||l.date||"")+"</span>"
      +'<span class="badge'+(isV?"":" ok")+'">'+(isV?"控车":"签到")+"</span>"
      +'<span class="u">'+esc(l.userName||"")+"</span>"
      +(isV?'<span class="muted">'+esc(l.actionText||l.action||"")+"</span>":"")
      +'<span class="sp" style="flex:1"></span>'
      +(l.success?'<span class="badge ok">成功'+(isV?"":" +"+num(l.totalGain||0)+" 分")+"</span>":'<span class="badge err">失败</span>')
      +"</div>"
      +(!isV&&steps?"<pre>"+steps+"</pre>":"")
      +(l.error?'<pre class="fail" style="color:var(--error)">'+esc(l.error)+"</pre>":"")
      +(isV&&l.message&&!l.error?'<pre>'+esc(l.message)+"</pre>":"")
      +"</div>";
  }).join("");
  el.innerHTML=h;
  el.querySelectorAll("[data-logf]").forEach(b=>b.onclick=()=>{S.logFilter=b.dataset.logf;renderLogs();});
}
function clearLogsFlow(){

let seedSaveTimer=null;
function previewSeed(hex,save){
  hex=/^#[0-9a-fA-F]{3,6}$/.test(hex)?hex:"#B7E830";
  applySeed(hex);
  S.settings.ui=Object.assign({},S.settings.ui,{seed:hex});
  $$("#seedRow .sw").forEach(b=>b.classList.toggle("on",b.dataset.seed.toUpperCase()===hex.toUpperCase()));
  const p=$("#seedPicker");if(p&&/^#[0-9a-fA-F]{6}$/.test(hex))p.value=hex;
  const x=$("#seedHex");if(x&&save)x.value=hex;
  if(save){
    clearTimeout(seedSaveTimer);
    seedSaveTimer=setTimeout(async()=>{
      const j=await postSettings({ui:{seed:hex,themeMode:(S.settings.ui||{}).themeMode||"system"}});
      if(j&&j.ok)snack("种子色已保存","ok");
    },350);
  }
}

function bindAddAcc(card,st){
  card.querySelectorAll("#addTabs button").forEach(b=>b.onclick=()=>{
    grabAdd(st,card);
    st.tab=b.dataset.tab;
    const body=card.querySelector(".dbody");
    body.innerHTML=addAccHtml(st);bindAddAcc(card,st);
  });
  const send=card.querySelector("#adSend");
  if(send){
    send.onclick=async()=>{
      grabAdd(st,card);
      if(!/^1\d{10}$/.test(st.phone)){snack("手机号格式不正确","err");return;}
      send.disabled=true;
      const d=await postJSON("/api/send-code",{phone:st.phone});
      if(d&&d.ok){
        snack(d.message||"验证码已发送","ok");
        let left=60;
        const t=setInterval(()=>{left--;send.textContent="重新发送("+left+")";if(left<=0){clearInterval(t);send.disabled=false;send.textContent="发送验证码";}},1000);
        send.textContent="重新发送(59)";
      }else{send.disabled=false;snack((d&&d.message)||"发送失败","err");}
    };
  }
  const fetchBtn=card.querySelector("#adFetch");
  if(fetchBtn){
    fetchBtn.onclick=async()=>{
      grabAdd(st,card);
      if(!st.token.trim()){snack("请先粘贴 Token","err");return;}
      fetchBtn.disabled=true;fetchBtn.textContent="识别中…";
      const d=await postJSON("/api/get-userid",{token:st.token.trim()});
      fetchBtn.disabled=false;fetchBtn.textContent="获取用户ID";
      if(d&&d.ok){
        st.uid=d.userId||"";st.uname=d.userName||"";
        const u=card.querySelector("#adUid");if(u)u.textContent="已识别："+(st.uname||"（无昵称）")+"（"+st.uid+"）";
        snack("识别成功","ok");
      }else snack("识别失败："+((d&&(d.error||d.message))||"未知"),"err");
    };
  }
}
function grabAdd(st,card){
  const g=id=>{const e=card.querySelector("#"+id);return e?e.value:"";};
  st.phone=g("adPhone")||st.phone;st.code=g("adCode")||st.code;st.basic=g("adBasic")||st.basic;st.token=g("adToken")||st.token;
}
async function submitAddAcc(st,card){
  grabAdd(st,card);
  if(st.tab==="phone"){
    if(!/^1\d{10}$/.test(st.phone)){snack("手机号格式不正确","err");return;}
    if(!st.code){snack("请填写验证码","err");return;}
    snack("登录中…","");
    const d=await postJSON("/api/phone-login",{phone:st.phone,code:st.code,basicAuth:st.basic||""});
    if(d&&d.ok){
      snack(d.message||"登录成功","ok");
      await refreshAccounts();
      closeDialog(card._entry||dlgStack[dlgStack.length-1]);
      loadHome("force");renderCfg();
    }else snack((d&&(d.message||d.error))||"登录失败","err");
  }else{
    if(!st.uid){snack("请先点「获取用户ID」识别账号","err");return;}
    const list=(S.CFG.accounts||[]).slice();
    const i=list.findIndex(a=>String(a.userId)===String(st.uid));
    const acc={userName:st.uname||(i>=0?list[i].userName:""),userId:st.uid,token:st.token.trim().replace(/^Bearer\s+/i,""),barkKey:i>=0?(list[i].barkKey||""):""};
    if(i>=0)list[i]=Object.assign({},list[i],acc);else list.push(acc);
    const d=await postJSON("/api/save-accounts",{accounts:list});
    if(d&&d.ok){
      snack(i>=0?"已更新该账号 Token":"账号已添加","ok");
      await refreshAccounts();
      closeDialog(card._entry||dlgStack[dlgStack.length-1]);
      loadHome("force");renderCfg();
    }else snack("保存失败："+((d&&d.error)||"未知"),"err");
  }
}

async function saveConfigFlow(card){
  const g=id=>{const e=card.querySelector("#"+id);return e?e.value.trim():"";};
  const cur=await api("/api/config");
  if(!cur||!cur.ok||!cur.config){snack("读取当前配置失败，已中止保存","err");return;}
  const patch={
    app:{appId:g("cfAppId"),appSecret:g("cfAppSecret")},
    h5:{appId:g("cfH5Id"),appSecret:g("cfH5Secret")},
    vehicleAesKey:g("cfAes"),
    autoRefreshSec:num(g("cfRefresh"),60),
    basicAuth:g("cfBasic"),
    widgetVehicle:g("cfWidget"),
    vehicleControlRisk:g("cfRisk"),
    community:{},
    vehicleMonitor:card.querySelector('[data-cf="vehicleMonitor"]').classList.contains("on"),
    autoSignin:card.querySelector('[data-cf="autoSignin"]').classList.contains("on"),
    autoSigninTime:g("cfSignTime")||"07:00"
  };
  card.querySelectorAll("[data-comm]").forEach(s=>patch.community[s.dataset.comm]=s.classList.contains("on"));
  const merged=deepMerge(cur.config,patch); /* 深合并：GET 最新全量 + 编辑结果 */
  const d=await postJSON("/api/save-config",merged);
  if(d&&d.ok){
    snack("脚本配置已保存","ok");
    S.CFG.config=merged;
    closeDialog(card._entry||dlgStack[dlgStack.length-1]);
    loadHome("force");
  }else snack("保存失败："+((d&&d.error)||"未知"),"err");
}

async function exportBackup(){
  const j=await api("/api/backup");
  if(!j||!j.ok){snack("导出失败："+((j&&j.error)||"未知"),"err");return;}
  try{
    const blob=new Blob([JSON.stringify(j,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="zeeho-backup-"+todayDash()+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    snack("备份已导出（"+((j.accounts||[]).length)+" 个账号）","ok");
  }catch(e){snack("导出失败："+e,"err");}
}

async function loadVehicle(mode){
  const el=$("#view-vehicle");
  const list=ptAccounts();
  if(!list.length){el.innerHTML=emptyHtml("person","暂无账号","请先在首页加载数据或在设置页添加账号。",'<button class="btn" onclick="switchView(\'cfg\')">去添加</button>');return;}
  if(S.VH.accIdx>=list.length)S.VH.accIdx=0;
  const acc=list[S.VH.accIdx];
  if(!acc.userId){el.innerHTML=vehChipsHtml("vh")+emptyHtml("alert","该账号缺少用户ID","请到设置页补全用户ID。");bindAccChips("vh",loadVehicle);return;}
  if(mode==="keep"){renderVehicle();return;}
  if(mode!=="silent")el.innerHTML=vehChipsHtml("vh")+'<div class="sk sk-card"></div>'+skeletonCards(2);
  const uid=encodeURIComponent(acc.userId);
  let mon=await api("/api/vehicle-monitor?userId="+uid);
  const vehList=(mon&&mon.ok&&Array.isArray(mon.vehicles))?mon.vehicles:[];
  if(S.VH.vin&&mon&&mon.ok&&mon.snapshot&&mon.snapshot.vin!==S.VH.vin){
    const mon2=await api("/api/vehicle-monitor?userId="+uid+"&vin="+encodeURIComponent(S.VH.vin));
    if(mon2&&mon2.ok){mon2.vehicles=vehList;mon=mon2;}
  }
  if(!S.VH.vin)S.VH.vin=(mon&&mon.snapshot&&mon.snapshot.vin)||(acc.vehicle&&acc.vehicle.currentVin)||"";
  S.VH.mon=mon;S.VH.vehList=vehList;
  const vinQ=S.VH.vin?"&vin="+encodeURIComponent(S.VH.vin):"";
  const [veh,bs,info]=await Promise.all([
    S.VH.vin?api("/api/vehicle?userId="+uid+vinQ):Promise.resolve(null),
    api("/api/battery-state?userId="+uid+vinQ),
    api("/api/info-center?userId="+uid+vinQ)
  ]);
  S.VH.veh=(veh&&veh.ok&&veh.result)?veh.result:null;
  S.VH.bs=(bs&&bs.ok)?bs:null;
  S.VH.info=(info&&info.ok)?info:null;
  renderVehicle();
}

async function vehiclePoll(){
  if(!S.VH.watch||S.view!=="vehicle")return;
  const list=ptAccounts();const acc=list[S.VH.accIdx];if(!acc||!acc.userId)return;
  api("/api/vehicle-monitor-tick"); /* fire-and-forget：充满/离线本地通知检查 */
  const uid=encodeURIComponent(acc.userId);
  const mon=await api("/api/vehicle-monitor?userId="+uid+(S.VH.vin?"&vin="+encodeURIComponent(S.VH.vin):""));
  if(mon&&mon.ok){S.VH.mon=mon;if(!S.VH.vehList.length&&mon.vehicles)S.VH.vehList=mon.vehicles;}
  const bs=await api("/api/battery-state?userId="+uid+(S.VH.vin?"&vin="+encodeURIComponent(S.VH.vin):""));
  if(bs&&bs.ok)S.VH.bs=bs;
  const ae=document.activeElement;
  const typing=ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&(ae.closest("#view-vehicle")||ae.closest("#dialoghost"));
  if(S.view==="vehicle"&&!typing)renderVehicle();
}
const CTRL_TEXT={find:"寻车",loudFind:"鸣笛闪灯",cushion:"开坐垫",unlock:"开锁",lock:"关锁"};
const CTRL_DESC={find:"短按寻车（车辆闪灯）",loudFind:"鸣笛闪灯（高声寻车）",cushion:"打开坐垫（坐垫会弹起）",unlock:"云端开锁",lock:"云端关锁"};
function riskAgreed(c){const v=String((c&&c.vehicleControlRisk)||"").trim();return v==="我同意风险并使用"||v==="我自愿承担相关风险"}
/* 车控风险确认：与移动版一致——首次控车弹窗告知风险，点「我同意风险并使用」写入 cfg.vehicleControlRisk 后放行，未同意前后端拦截一切控车指令 */
async function ensureRisk(){
  if(S.riskOk)return true;
  const cur=await api("/api/config");
  const base=(cur&&cur.config)||null;
  if(base&&riskAgreed(base)){S.riskOk=true;return true;}
  const ok=await new Promise(res=>{
    openDialog({title:"车控功能风险告知",icon:"alert",
      body:'<div style="line-height:1.75;font-size:13.5px">寻车 / 鸣笛 / 坐垫 / 开锁 / 关锁等指令经 4G 云端下发，会<b>真实操作你的车辆</b>。受网络延迟、信号等影响，指令可能延迟、失败，极端情况下车辆可能意外动作（如误开锁）。使用车控功能即视为你已充分知悉并自愿承担上述风险，由此产生的一切后果由你自行承担。</div>',
      actions:[{label:"我不同意风险不使用",variant:"text",onClick:()=>res(false)},{label:"我同意风险并使用",variant:"danger",onClick:()=>res(true)}]});
  });
  if(!ok){snack("未同意风险，车控功能不启用","info");return false;}
  const merged=deepMerge(base||{},{vehicleControlRisk:"我同意风险并使用"});
  const d=await postJSON("/api/save-config",merged);
  if(d&&d.ok){S.riskOk=true;if(S.CFG)S.CFG.config=merged;snack("已同意风险，车控功能已启用","ok");return true;}
  snack("风险确认保存失败："+((d&&(d.error||d.message))||"未知"),"err");
  return false;
}
function ctrlAct(action,btn){
  const list=ptAccounts();const acc=list[S.VH.accIdx];
  if(!acc||!acc.userId){snack("请先选择账号","err");return;}
  ensureRisk().then(ok=>{
    if(!ok)return;
    const danger=action==="unlock"||action==="lock";
    confirmDialog("确认执行 "+(CTRL_DESC[action]||CTRL_TEXT[action]||action),"该指令会通过 4G 网络真实控制你的车辆："+(acc.userName||acc.userId)+"。",()=>runCtrl(action,btn),CTRL_TEXT[action]||"确定",danger);
  });
}
async function runCtrl(action,btn){
  const list=ptAccounts();const acc=list[S.VH.accIdx];
  if(btn)btn.disabled=true;
  const d=await postJSON("/api/vehicle-control",{userId:acc.userId,action:action,vin:S.VH.vin||""});
  if(btn)btn.disabled=false;
  if(d&&d.ok){snack((CTRL_TEXT[action]||"指令")+"已下发","ok");loadVehicle("silent");}
  else{
    const msg=(d&&(d.message||d.error))||"未知";
    if(String(msg).indexOf("车控风险确认")>=0)S.riskOk=false; /* 后端仍拦截：下次点击重新走风险弹窗 */
    snack((CTRL_TEXT[action]||"指令")+"失败："+msg,"err");
  }
}

async function loadPoints(mode){
  const el=$("#view-points");
  const list=ptAccounts();
  if(!list.length){el.innerHTML=emptyHtml("person","暂无账号","请先在首页加载数据或在设置页添加账号。",'<button class="btn" onclick="switchView(\'cfg\')">去添加</button>');return;}
  if(S.PT.accIdx>=list.length)S.PT.accIdx=0;
  const acc=list[S.PT.accIdx];
  if(!acc.userId){el.innerHTML=accChipsHtmlPt()+emptyHtml("alert","该账号缺少用户ID","请到设置页补全用户ID。");bindAccChipsPt();return;}
  if(mode==="keep"){renderPoints();return;}
  if(mode!=="silent")el.innerHTML=accChipsHtmlPt()+'<div class="sk sk-card"></div>'+skeletonCards(2);
  const uid=encodeURIComponent(acc.userId);
  const [it,cnt]=await Promise.all([
    api("/api/integral?userId="+uid+"&page=1&pageSize=20"),
    api("/api/supplement?userId="+uid+"&action=count")
  ]);
  if(!it||!it.ok){el.innerHTML=accChipsHtmlPt()+emptyHtml("alert","积分加载失败",esc(it&&(it.error||it.detailError)||"网络异常"),'<button class="btn" onclick="loadPoints(\'force\')">重试</button>');bindAccChipsPt();return;}
  S.PT.items=dedupeDetail(it.detail||[]);
  S.PT.page=1;
  S.PT.done=!it.detail||it.detail.length<20;
  S.PT.totalObj=(it&&it.total)||null;
  S.PT.expire=(it&&it.expire)||[];
  S.PT.signin=(it&&it.signinCount)||null; /* 官方实时签到统计：连签/盲盒以此为准，不用首页缓存 */
  S.PT.card=(cnt&&cnt.ok&&cnt.data!=null)?(typeof cnt.data==="number"||typeof cnt.data==="string"?String(cnt.data):"--"):"--";
  renderPoints();
}
function dedupeDetail(arr){
  const seen={},out=[];
  for(const d of arr){const k=String(d&&d.integralDetailId!=null?d.integralDetailId:(d&&d.createDateStr)||JSON.stringify(d));if(!seen[k]){seen[k]=1;out.push(d);}}
  return out;
}
function accChipsHtmlPt(){
  const list=ptAccounts();
  return'<div class="chips">'+list.map((a,i)=>'<button class="chip'+(i===S.PT.accIdx?" on":"")+'" data-pt="'+i+'">'+esc(a.userName||("账号"+(i+1)))+"</button>").join("")+"</div>";
}
function bindAccChipsPt(){
  $$("#view-points [data-pt]").forEach(b=>b.onclick=()=>{S.PT.accIdx=+b.dataset.pt;S.PT.items=[];S.PT.page=1;S.PT.done=false;loadPoints("force");});
}
async function loadMorePoints(){
  const PT=S.PT;
  if(PT.loading||PT.done)return;
  const acc=ptAccounts()[PT.accIdx];if(!acc)return;
  PT.loading=true;
  const btn=$("#ptMore");if(btn){btn.disabled=true;btn.textContent="加载中…";}
  const j=await api("/api/integral?userId="+encodeURIComponent(acc.userId)+"&page="+(PT.page+1)+"&pageSize=20");
  PT.loading=false;
  if(j&&j.ok){
    PT.page++;
    const before=PT.items.length;
    PT.items=dedupeDetail(PT.items.concat(j.detail||[]));
    if(!j.detail||j.detail.length<20)PT.done=true;
    if(PT.items.length===before&&j.detail&&j.detail.length)PT.done=true; /* 全部重复 */
    renderPoints();
  }else{
    snack("加载失败："+((j&&j.error)||"未知"),"err");
    if(btn){btn.disabled=false;btn.textContent="加载更多";}
  }
}

  h+='<div class="foot">积分数据来自极核实时 API · 分页按 integralDetailId 去重合并</div>';
  el.innerHTML=h;
  bindAccChipsPt();
  const m=$("#ptMore");if(m)m.onclick=loadMorePoints;
  const g=$("#ptGain");if(g)g.onclick=supGain;
  const c=$("#ptCal");if(c)c.onclick=openCalDialog;
}
async function supGain(){
  const acc=ptAccounts()[S.PT.accIdx];if(!acc||!acc.userId)return;
  confirmDialog("兑换补签卡","使用积分兑换 1 张补签卡？",async()=>{
    snack("兑换中…","");
    const d=await api("/api/supplement?userId="+encodeURIComponent(acc.userId)+"&action=gain");
    if(d&&d.ok){snack("兑换成功","ok");loadPoints("force");}
    else snack("兑换失败："+((d&&(d.message||d.error))||"未知"),"err");
  },"确认兑换");
}
function openCalDialog(){
  const acc=ptAccounts()[S.PT.accIdx];
  if(!acc||!acc.userId){snack("请先选择账号","err");return;}
  if(!S.PT.month)S.PT.month=curMonthDash();
  const entry=openDialog({title:"补签月历 · "+esc(acc.userName||""),icon:"calendar",wide:true,body:'<div class="hint">加载日历中…</div>',
    actions:[{label:"关闭",variant:"text"}]});
  fetchCal(entry);
}
async function fetchCal(entry){
  const acc=ptAccounts()[S.PT.accIdx];if(!acc)return;
  S.PT.calLoading=true;
  const d=await api("/api/supplement?userId="+encodeURIComponent(acc.userId)+"&action=month&month="+encodeURIComponent(S.PT.month));
  S.PT.calLoading=false;
  if(d&&d.ok&&d.data){
    S.PT.cal=d.data;
    entry.card.querySelector(".dbody").innerHTML=calBodyHtml();
    bindCal(entry);
  }else{
    entry.card.querySelector(".dbody").innerHTML='<div class="hint" style="color:var(--error)">日历加载失败：'+esc((d&&(d.message||d.error))||"可能限流，稍后再试")+"</div>";
  }
}
function calBodyHtml(){
  const data=S.PT.cal||{};
  const days=(data.nowSignDetailVos||[]).concat(data.beforeSignDetailVos||[],data.afterSignDetailVos||[]);
  const month=S.PT.month||curMonthDash();
  const p=month.split("-"),y=+p[0],m=+p[1];
  const first=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate();
  const tStr=todayDash();
  let h='<div class="row mb8"><button class="btn text sm" id="calPrev">'+ic("left")+"上月</button><span class=\"sp\" style=\"flex:1;text-align:center;font-weight:600\">"+esc(month)+"</span><button class=\"btn text sm\" id=\"calNext\">下月"+ic("right")+"</button></div>";
  h+='<div class="cal">'+["日","一","二","三","四","五","六"].map(w=>'<div class="wd">'+w+"</div>").join("");
  for(let i=0;i<first;i++)h+='<div class="d blank"></div>';
  for(let d=1;d<=dim;d++){
    const ds=month+"-"+pad2(d);
    const e=days.find(x=>x&&x.createDate===ds);
    const st=e?num(e.signStatue):-1;
    const signed=st===3||st===5||st===0;
    const future=ds>tStr;
    const cls="d"+(signed?" signed":(future?" future":(e?" miss":"")));
    const mark=signed?(st===0?"盒":"✓"):(future?"":(e?"漏":""));
    h+='<div class="'+cls+(ds===tStr?" today":"")+'"'+(signed||future||!e?"":' data-miss="'+ds+'"')+'><span>'+d+"</span>"+(mark?'<i>'+mark+"</i>":"")+"</div>";
  }
  h+="</div>";
  h+='<div class="hint" style="margin-top:10px">✓=已签 · 盒=盲盒日（算已签，连签边界） · 红=漏签（点击消耗 1 张补签卡） · 补签限 30 天内。当前补签卡：'+esc(S.PT.card||"--")+"</div>";
  return h;
}
function bindCal(entry){
  const pv=entry.card.querySelector("#calPrev"),nx=entry.card.querySelector("#calNext");
  if(pv)pv.onclick=()=>{S.PT.month=monthShift(S.PT.month,-1);fetchCal(entry);};
  if(nx)nx.onclick=()=>{S.PT.month=monthShift(S.PT.month,1);fetchCal(entry);};
  entry.card.querySelectorAll("[data-miss]").forEach(cell=>cell.onclick=()=>{
    const ds=cell.dataset.miss;
    const acc=ptAccounts()[S.PT.accIdx];if(!acc)return;
    confirmDialog("积分补签","使用 1 张补签卡补签 "+ds+" ？",async()=>{
      snack("补签中…","");
      const d=await api("/api/supplement?userId="+encodeURIComponent(acc.userId)+"&action=consume&dateTime="+encodeURIComponent(ds));
      if(d&&d.ok){snack("补签成功","ok");fetchCal(entry);loadPoints("force");}
      else snack("补签失败："+((d&&(d.message||d.error))||"未知"),"err");
    },"确认补签");
  });
}

/* =====================================================================
   分区四：ride 骑行（/api/ride-month 统计 · /api/ride-track 轨迹分页）
   ===================================================================== */
async function loadRide(mode){
  const el=$("#view-ride");
  const list=ptAccounts();
  if(!list.length){el.innerHTML=emptyHtml("person","暂无账号","请先在首页加载数据或在设置页添加账号。",'<button class="btn" onclick="switchView(\'cfg\')">去添加</button>');return;}
  if(S.RT.accIdx>=list.length)S.RT.accIdx=0;
  const acc=list[S.RT.accIdx];
  if(!acc.userId){el.innerHTML=accChipsHtmlRt()+emptyHtml("alert","该账号缺少用户ID","请到设置页补全用户ID。");bindAccChipsRt();return;}
  if(mode==="keep"){renderRide();return;}
  if(mode!=="silent")el.innerHTML=accChipsHtmlRt()+'<div class="sk sk-card"></div>'+skeletonCards(2);
  const uid=encodeURIComponent(acc.userId);
  if(!S.RT.vehList.length){
    const mon=await api("/api/vehicle-monitor?userId="+uid);
    S.RT.vehList=(mon&&mon.ok&&Array.isArray(mon.vehicles))?mon.vehicles:[];
    if(!S.RT.vin)S.RT.vin=(S.RT.vehList[0]||{}).vinNo||(acc.vehicle&&acc.vehicle.currentVin)||"";
  }
  if(!S.RT.month)S.RT.month=curMonthDash();
  const vinQ=S.RT.vin?"&vin="+encodeURIComponent(S.RT.vin):"";
  const [rm,tr]=await Promise.all([
    api("/api/ride-month?userId="+uid+vinQ+"&month="+encodeURIComponent(S.RT.month.replace("-","."))),
    api("/api/ride-track?userId="+uid+vinQ+"&month="+encodeURIComponent(S.RT.month)+"&page=1&pageSize=20")
  ]);
  S.RT.stat=(rm&&rm.ok)?(rm.data&&rm.data.rideRecordList)||[]:null;
  S.RT.statErr=(rm&&!rm.ok)?(rm.error||"月度统计获取失败"): "";
  S.RT.items=(tr&&tr.ok&&Array.isArray(tr.days))?tr.days:[];
  S.RT.trackErr=(tr&&!tr.ok)?(tr.error||"轨迹获取失败"):"";
  S.RT.page=1;S.RT.done=!S.RT.items.length||!tr||!tr.ok;
  renderRide();
}
function accChipsHtmlRt(){
  const list=ptAccounts();
  return'<div class="chips">'+list.map((a,i)=>'<button class="chip'+(i===S.RT.accIdx?" on":"")+'" data-rt="'+i+'">'+esc(a.userName||("账号"+(i+1)))+"</button>").join("")+"</div>";
}
function bindAccChipsRt(){
  $$("#view-ride [data-rt]").forEach(b=>b.onclick=()=>{
    S.RT.accIdx=+b.dataset.rt;S.RT.vin="";S.RT.vehList=[];S.RT.items=[];S.RT.page=1;S.RT.stat=null;S.RT.done=false;
    loadRide("force");
  });
}
async function loadMoreRide(){
  const RT=S.RT;
  if(RT.loading||RT.done)return;
  const acc=ptAccounts()[RT.accIdx];if(!acc)return;
  RT.loading=true;
  const btn=$("#rtMore");if(btn){btn.disabled=true;btn.textContent="加载中…";}
  const j=await api("/api/ride-track?userId="+encodeURIComponent(acc.userId)+(RT.vin?"&vin="+encodeURIComponent(RT.vin):"")+"&month="+encodeURIComponent(RT.month)+"&page="+(RT.page+1)+"&pageSize=20");
  RT.loading=false;
  if(j&&j.ok){
    RT.page++;
    const days=j.days||[];
    if(!days.length)RT.done=true;
    for(const d of days){
      const ex=RT.items.find(x=>x.dayTime===d.dayTime);
      if(ex)ex.historyList=(ex.historyList||[]).concat(d.historyList||[]);
      else RT.items.push(d);
    }
    renderRide();
  }else{
    snack("加载失败："+((j&&j.error)||"未知"),"err");
    if(btn){btn.disabled=false;btn.textContent="加载更多";}
  }
}
function addrName(s){
  try{const o=JSON.parse(s);return o&&o.name?String(o.name):String(s||"");}catch(e){return String(s||"");}
}
function renderRide(){
  const el=$("#view-ride");
  const RT=S.RT;
  let h=accChipsHtmlRt();
  if((RT.vehList||[]).length>1)h+='<div class="chips">'+RT.vehList.map(x=>'<button class="chip'+(RT.vin===x.vinNo?" on":"")+'" data-rvin="'+esc(x.vinNo)+'">'+esc(x.vehicleType||x.name||x.vinNo)+"</button>").join("")+"</div>";
  h+='<div class="row mb8"><button class="btn text sm" id="rtPrev">'+ic("left")+"上月</button><span class=\"sp\" style=\"flex:1;text-align:center;font-weight:600\">"+esc(RT.month||curMonthDash())+'</span><button class="btn text sm" id="rtNext">下月'+ic("right")+"</button></div>";
  /* 月度统计 */
  const recs=RT.stat||[];
  let sumKm=0,sumMin=0,maxV=0,sumA=0,sumB=0,sumD=0;
  for(const r of recs){
    sumKm+=num(r.rideMileage);
    sumMin+=num(r.ridingTimeDayUnitMinute);
    if(num(r.maxSpeed)>maxV)maxV=num(r.maxSpeed);
    sumA+=num(r.accelerationTimesDay);
    sumB+=num(r.brakesTimesDay);
    sumD+=num(r.bendingTimesDay);
  }
  const durTxt=sumMin>=60?(Math.floor(sumMin/60)+"h"+pad2(Math.round(sumMin%60))+"m"):(sumMin>0?Math.round(sumMin)+"min":"0");
  h+='<div class="card"><div class="card-title">'+ic("route")+"月度统计"+(RT.month?" · "+esc(RT.month):"")+'<span class="sp"></span><span class="hint2">'+(RT.stat?recs.length+" 天":esc(RT.statErr||""))+"</span></div>"
    +'<div class="grid3">'
    +'<div class="stat"><div class="lb">里程</div><div class="vl num">'+(sumKm>0?sumKm.toFixed(1):"0")+' <small>km</small></div></div>'
    +'<div class="stat"><div class="lb">时长</div><div class="vl num">'+durTxt+"</div></div>"
    +'<div class="stat"><div class="lb">极速</div><div class="vl num">'+(maxV>0?Math.round(maxV):"--")+' <small>km/h</small></div></div>'
    +"</div>"
    +'<div class="grid3 mt8">'
    +'<div class="stat"><div class="lb">急加速</div><div class="vl num" style="color:var(--tertiary)">'+sumA+"</div></div>"
    +'<div class="stat"><div class="lb">急刹</div><div class="vl num" style="color:var(--tertiary)">'+sumB+"</div></div>"
    +'<div class="stat"><div class="lb">压弯</div><div class="vl num" style="color:var(--tertiary)">'+sumD+"</div></div>"
    +"</div>"
    +(RT.statErr?'<div class="hint" style="color:var(--error)">'+esc(RT.statErr)+"（限官方隐藏字段，可能偶发失败）</div>":"")
    +"</div>";
  /* 轨迹分页列表 */
  h+='<div class="card"><div class="card-title">'+ic("pin")+'骑行轨迹<span class="sp"></span><span class="hint2">'+(RT.items.length?RT.items.length+" 天":"")+"</span></div>";
  if(RT.trackErr&&!RT.items.length)h+='<div class="hint" style="color:var(--error)">'+esc(RT.trackErr)+"</div>";
  if(!RT.items.length&&!RT.trackErr)h+='<div class="hint">该月暂无骑行轨迹（换个月份或确认账号已绑定车辆）</div>';
  for(const day of RT.items){
    h+='<div class="trk"><div class="dh">'+ic("calendar")+"<span>"+esc(day.dayTime||"")+'</span><span class="sp"></span><span class="km num">'+num(day.dayRideMileage).toFixed(1)+" km</span></div>";
    (day.historyList||[]).forEach((r,ri)=>{
      const open=RT["open_"+day.dayTime+"_"+ri];
      h+='<div class="ride'+(open?" open":"")+'" data-ride="'+esc(day.dayTime)+'|'+ri+'">'
        +'<div class="r1"><span class="tm">'+esc(String(r.startTime||"").replace(/^[\d.]+\s/,"")+"→"+String(r.endTime||"").replace(/^[\d.]+\s/,""))+"</span>"
        +'<span class="ad">'+esc(addrName(r.startAddr))+" → "+esc(addrName(r.endAddr))+"</span>"
        +'<span class="km num">'+num(r.rideMileage).toFixed(1)+" km</span>"+ic("right","chev")+"</div>"
        +'<div class="r2">里程 '+num(r.rideMileage)+' km · 时长 '+num(r.ridingTimeUnitMinute)+' 分钟 · 极速 '+num(r.maxSpeed)+' km/h<br>急加速 '+num(r.accelerationTimes)+' 次 · 急刹 '+num(r.brakesTimes)+' 次 · 压弯 '+num(r.bendingTimes)+' 次 · 能耗 '+num(r.powerConsumption)+' · 绿色贡献 '+num(r.greenContribution)+'<br>起止：'+esc(r.startTime)+" → "+esc(r.endTime)+"</div>"
        +"</div>";
    });
    h+="</div>";
  }
  if(!RT.done&&RT.items.length)h+='<div class="row mt8" style="justify-content:center"><button class="btn tonal sm" id="rtMore">加载更多</button></div>';
  h+="</div>";
  h+='<div class="foot">数据来源：极核 myRideInfo / ridetrack_v2 · 轨迹按所选月份分页（每页 20 趟）</div>';
  el.innerHTML=h;
  bindAccChipsRt();
  el.querySelectorAll("[data-rvin]").forEach(b=>b.onclick=()=>{S.RT.vin=b.dataset.rvin;S.RT.items=[];S.RT.page=1;S.RT.done=false;loadRide("force");});
  const pv=$("#rtPrev"),nx=$("#rtNext");
  if(pv)pv.onclick=()=>{S.RT.month=monthShift(S.RT.month,-1);S.RT.items=[];S.RT.done=false;loadRide("force");};
  if(nx)nx.onclick=()=>{S.RT.month=monthShift(S.RT.month,1);S.RT.items=[];S.RT.done=false;loadRide("force");};
  const rm=$("#rtMore");if(rm)rm.onclick=loadMoreRide;
  el.querySelectorAll("[data-ride]").forEach(r=>r.onclick=()=>{
    const k="open_"+r.dataset.ride.replace("|","_");
    S.RT[k]=!S.RT[k];
    r.classList.toggle("open",!!S.RT[k]);
  });
}
/* ================= 启动时序：settings → panel-open → data ================= */
(async function boot(){
  initTitlebar();
  buildRail();
  await loadSettings();
  applyUi();
  api("/api/panel-open"); /* fire-and-forget */
  switchView("home"); /* 触发 loadHome 首屏加载 */
})();
</script>
