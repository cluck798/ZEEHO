# ========== 极核 ZEEHO · Quantumult X 一键订阅 ==========
# 使用方式：Quantumult X → 配置文件 → [rewrite_remote] / [task_local]
# 1) rewrite_remote 添加本文件（自动加载抓Token规则）
# 2) task_local 添加签到任务（见下方，或直接复制）
# 3) [MITM] hostname 添加 zeehoev.com / www.example.com
# ⚠️ 注意：QX 要求真实可解析域名，增强面板请用 www.example.com（脚本自动推断），
# 手机浏览器访问 http://www.example.com 打开面板。
# ====================================================

[rewrite_local]
# 极核ZEEHO增强面板（浏览器访问 http://www.example.com 打开面板，脚本改写返回HTML）
^https?:\/\/www\.example\.com\/.* url script-response-body https://raw.githubusercontent.com/cluck798/ZEEHO/refs/heads/main/script/zeeho_box_enhanced.js?v=2.16.57

# 官方 App 请求头：每个请求换新 UA（QX 请求头脚本）
^https?:\/\/.*zeehoev\.com\/.* url script-request-header https://cdn.jsdelivr.net/gh/cluck798/ZEEHO@main/script/zeeho_ua.js?v=1

# 车辆图片替换（直改车辆接口响应体图片URL，需在面板设置页配置车型图）
^https:\/\/tapi\.zeehoev\.com\/v1\.0\/app\/cfmotoserverapp\/(vehicle\/(list|widgets|details)|vehicleHomePageV2|vehicleInfo|vehicle\/properties) url script-response-body https://raw.githubusercontent.com/cluck798/ZEEHO/refs/heads/main/script/zeeho_box_enhanced.js?v=2.16.57

# 极核Token自动捕获（打开极核App → 我的页面）
^https:\/\/tapi\.zeehoev\.com\/v1\.0\/mine\/cfmotoservermine\/setting url script-response-body https://raw.githubusercontent.com/cluck798/ZEEHO/refs/heads/main/script/zeeho.js?v=2.5.8

[task_local]
# 极核每日签到（每天 07:00，可自行修改时间）
0 7 * * * https://raw.githubusercontent.com/cluck798/ZEEHO/refs/heads/main/script/zeeho.js?v=2.5.8, tag=极核每日签到, img-url=https://raw.githubusercontent.com/cluck798/ZEEHO/main/ZEEHO.png, enabled=true

[MITM]
hostname = tapi.zeehoev.com, h5.zeehoev.com, www.example.com
