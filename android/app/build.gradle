plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zeeho.signpanel'
    compileSdk 36

    defaultConfig {
        applicationId "com.zeeho.signpanel"
        minSdk 24
        targetSdk 34
        versionCode 2026102819
        versionName "1.2.44"
    }

    // 多账号版 / 单账号版：同一套内核，独立包名与名称，可同时安装
    flavorDimensions "edition"
    productFlavors {
        multi {
            dimension "edition"
            applicationId "com.zeeho.signpanel"
            manifestPlaceholders = [appName: "极核签到面板"]
            buildConfigField "boolean", "SINGLE_EDITION", "false"
        }
        single {
            dimension "edition"
            applicationId "com.zeeho.signpanel.single"
            manifestPlaceholders = [appName: "极核单账号版"]
            buildConfigField "boolean", "SINGLE_EDITION", "true"
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'

    // QuickJS-KT (JS engine) — note groupId is dokar3
    implementation 'io.github.dokar3:quickjs-kt:1.0.15'

    // Local HTTP server
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // HTTP client (bypasses CORS for $httpClient)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // WorkManager（后台定时签到）
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // MITM 抓包：动态签发站点证书（CA + 站点证书）
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
}
