plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.zeeho.signpanel'
    compileSdk 36

    defaultConfig {
        applicationId "com.zeeho.signpanel"
        minSdk 24
        targetSdk 34
        versionCode 20261010
        versionName "1.2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/kotlin']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.material:material:1.12.0'

    // QuickJS-KT (JS engine) — note groupId is dokar3
    implementation 'io.github.dokar3:quickjs-kt:1.0.15'

    // Local HTTP server
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // HTTP client (bypasses CORS for $httpClient)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // WorkManager（后台定时签到）
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
