name: ZeehoSignPanel
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "14.0"
settings:
  base:
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  ZeehoPanel:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
      - path: App/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: ZeehoPanel
        PRODUCT_BUNDLE_IDENTIFIER: com.zeeho.signpanel
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ZeehoPanel.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        OTHER_LDFLAGS: "-weak_framework WidgetKit -weak_framework ActivityKit"
    dependencies:
      - target: ZeehoWidget
      - target: ZeehoLiveWidget
  ZeehoSingle:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
      - path: App/Info-Single.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: ZeehoSingle
        PRODUCT_BUNDLE_IDENTIFIER: com.zeeho.signpanel.single
        INFOPLIST_FILE: App/Info-Single.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_ENTITLEMENTS: App/ZeehoSingle.entitlements
        OTHER_LDFLAGS: "-weak_framework WidgetKit -weak_framework ActivityKit"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) SINGLE_EDITION=1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: SINGLE_EDITION
    dependencies:
      - target: ZeehoWidgetSingle
      - target: ZeehoLiveWidgetSingle
  ZeehoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: Widget/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: ZeehoWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.zeeho.signpanel.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/ZeehoWidget.entitlements
        ENABLE_BITCODE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SKIP_INSTALL: "NO"
  ZeehoWidgetSingle:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: Widget/Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: ZeehoWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.zeeho.signpanel.single.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/ZeehoWidgetSingle.entitlements
        ENABLE_BITCODE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        SKIP_INSTALL: "NO"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: SINGLE_WIDGET
  # 实时活动独立扩展（iOS 16.1 同一 bundle 内含桌面小组件时灵动岛可能不显示）
  ZeehoLiveWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/LiveSources
      - path: Shared
      - path: Widget/LiveInfo.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: ZeehoLiveWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.zeeho.signpanel.livewidget
        INFOPLIST_FILE: Widget/LiveInfo.plist
        ENABLE_BITCODE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        SKIP_INSTALL: "NO"
        OTHER_LDFLAGS: "-weak_framework ActivityKit"
  ZeehoLiveWidgetSingle:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/LiveSources
      - path: Shared
      - path: Widget/LiveInfo.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: ZeehoLiveWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.zeeho.signpanel.single.livewidget
        INFOPLIST_FILE: Widget/LiveInfo.plist
        ENABLE_BITCODE: "NO"
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
        SKIP_INSTALL: "NO"
        OTHER_LDFLAGS: "-weak_framework ActivityKit"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: SINGLE_WIDGET
