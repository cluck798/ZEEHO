<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>极核诊断</title>
<style>
  :root {
    --bg: #0a0f1e; --panel: #151b2e; --panel2: #1d2540; --border: #2a3554;
    --text: #dce6ef; --muted: #8296a8; --accent: #35c46f; --accent2: #2f9de0;
    --warn: #e0a63a; --err: #e05a4e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", system-ui, sans-serif;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { padding: 12px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
  header .back { width: 32px; height: 32px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--border);
                 color: var(--text); font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { display: block; color: var(--muted); font-size: 11px; font-weight: 400; }
  .status-pill { margin-left: auto; padding: 3px 12px; border-radius: 999px; font-size: 12px; background: var(--panel2); border: 1px solid var(--border); white-space: nowrap; }
  .status-pill.ok { color: var(--accent); border-color: var(--accent); }
  .status-pill.err { color: var(--err); border-color: var(--err); }
  main { padding: 12px 14px 30px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 13px 14px; }
  .card h2 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .card h2 .step { background: var(--accent2); color: #fff; width: 20px; height: 20px; border-radius: 50%;
                   display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none; }
  button { background: var(--accent2); color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; font-size: 13px; cursor: pointer; }
  button:active { filter: brightness(1.15); }
  button:disabled { opacity: .45; }
  button.green { background: var(--accent); }
  button.ghost { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  input { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 8px;
          padding: 9px 10px; font-size: 13px; outline: none; width: 100%; }
  input:focus { border-color: var(--accent2); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .dev-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow: auto; }
  .dev-item { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
              display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .dev-item.sel { border-color: var(--accent); }
  .dev-item .rssi { margin-left: auto; color: var(--muted); font-size: 12px; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; margin-top: 10px; }
  .kv .k { color: var(--muted); }
  .kv .v { word-break: break-all; font-family: Menlo, Consolas, monospace; font-size: 13px; }
  .log-box { background: #070b14; border: 1px solid var(--border); border-radius: 8px; padding: 10px; height: 170px;
             overflow: auto; font: 11px/1.7 Menlo, Consolas, monospace; color: #9fb4c7; white-space: pre-wrap; word-break: break-all; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 4px; font-size: 12px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
  .tag.ok { color: var(--accent); border-color: var(--accent); }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--muted); border-top-color: transparent;
          border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="back" id="btnBack">←</div>
  <h1>极核诊断<span class="sub">ZeeCare 协议 · DoIP/UDS 只读</span></h1>
  <span class="status-pill" id="connPill">未连接</span>
</header>
<main>
  <!-- 步骤1：发现车辆 -->
  <div class="card">
    <h2><span class="step">1</span>发现车辆</h2>
    <div class="row">
      <button id="btnBleScan">蓝牙扫描车辆</button>
      <span class="hint">扫描 zeehok1-* 蓝牙广播</span>
    </div>
    <div class="dev-list" id="devList"></div>
    <div class="row">
      <input id="manualName" placeholder="或手动输入蓝牙名，如 zeehok1-abcdef1234" style="flex:1" />
      <button class="ghost" id="btnManual">使用</button>
    </div>
    <div class="row">
      <input id="manualVin" placeholder="或输入 VIN（后 8 位以上）" style="flex:1" />
      <button class="ghost" id="btnVin">使用</button>
    </div>
    <div class="hint" id="credHint"></div>
  </div>

  <!-- 步骤2：连接车辆热点 -->
  <div class="card">
    <h2><span class="step">2</span>连接车辆 WiFi</h2>
    <div class="row">
      <input id="ssid" placeholder="SSID（如 ZEEHO-XXXXXX）" style="flex:1" />
      <input id="pwd" placeholder="密码" style="flex:1" />
    </div>
    <div class="row">
      <button id="btnWifiSettings" class="green">去系统设置连接热点</button>
    </div>
    <div class="hint">iOS 无法由应用直接连 WiFi：点上方按钮跳转系统设置，手动连接推导出的 ZEEHO 热点后返回本应用。连接后车辆网关为 192.168.49.1。</div>
  </div>

  <!-- 步骤3：诊断 -->
  <div class="card">
    <h2><span class="step">3</span>车辆诊断（只读）</h2>
    <div class="row">
      <button id="btnDiagConnect" class="green">连接诊断接口</button>
      <button id="btnDiagDisconnect" class="ghost">断开</button>
    </div>
    <div class="row">
      <button id="btnReadInfo">读取车辆信息</button>
      <button id="btnCheckOnline" class="ghost">检测 VCDM 在线</button>
      <button id="btnReadFault" class="ghost">读取故障码</button>
    </div>
    <div class="kv" id="infoKv" style="display:none"></div>
    <div class="row" id="faultRow" style="display:none">
      <span class="k" style="color:var(--muted)">故障码原始响应：</span>
      <span class="v" id="faultHex" style="font-family:Menlo,Consolas,monospace;word-break:break-all"></span>
    </div>
  </div>

  <!-- 日志 -->
  <div class="card">
    <h2>日志 / PDU 监视</h2>
    <div class="log-box" id="logBox"></div>
  </div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { devices: [], selected: null };

  // ---------- 原生桥（WKScriptMessageHandlerWithReply） ----------
  // postMessage 返回 Promise：native reply(result, nil) → resolve(result)；native reply(nil, error) → reject(error)
  function zhDiagCall(op, args) {
    try {
      return window.webkit.messageHandlers.zhDiag.postMessage({ op: op, args: args || {} });
    } catch (e) {
      return Promise.reject(e);
    }
  }

  function log(msg) {
    var box = $("logBox");
    var t = new Date().toLocaleTimeString("zh-CN", { hour12: false });
    box.textContent += "[" + t + "] " + msg + "\n";
    box.scrollTop = box.scrollHeight;
    if (box.textContent.length > 60000) box.textContent = box.textContent.slice(-40000);
  }

  // 原生事件（log / pdu）
  window.__zhDiagEvent = function (type, message) {
    log((type === "pdu" ? "PDU " : "") + message);
  };

  function setPill(text, cls) {
    var pill = $("connPill");
    pill.textContent = text;
    pill.className = "status-pill" + (cls ? " " + cls : "");
  }

  function setBusy(btn, busy, busyText) {
    if (busy) {
      btn.dataset.orig = btn.textContent;
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span>' + (busyText || "处理中…");
    } else {
      btn.disabled = false;
      if (btn.dataset.orig) btn.textContent = btn.dataset.orig;
    }
  }

  $("btnBack").addEventListener("click", function () {
    if (history.length > 1) history.back();
    else location.href = "/";
  });

  // ---------- 步骤1：蓝牙扫描 ----------
  $("btnBleScan").addEventListener("click", function () {
    var btn = $("btnBleScan");
    setBusy(btn, true, "扫描中…");
    zhDiagCall("bleScan", { durationMs: 12000 }).then(function (devices) {
      state.devices = devices || [];
      renderDevices();
      if (!state.devices.length) log("未发现车辆蓝牙广播。请确认车辆已开机，或手动输入蓝牙名/VIN。");
    }).catch(function (e) {
      log("蓝牙扫描失败: " + e.message + "（首次使用请在系统弹窗允许蓝牙权限）");
    }).finally(function () { setBusy(btn, false); });
  });

  function renderDevices() {
    var list = $("devList");
    list.innerHTML = "";
    state.devices.forEach(function (d) {
      var el = document.createElement("div");
      el.className = "dev-item" + (state.selected === d.name ? " sel" : "");
      el.innerHTML = "<span>" + d.name + "</span><span class='rssi'>RSSI " + d.rssi + " dBm</span>";
      el.addEventListener("click", function () { selectDevice(d.name); });
      list.appendChild(el);
    });
  }

  function selectDevice(name) {
    state.selected = name;
    renderDevices();
    zhDiagCall("wifiCredentials", { deviceName: name }).then(function (cred) {
      $("ssid").value = cred.ssid;
      $("pwd").value = cred.password;
      $("credHint").textContent = "已推导 WiFi 凭证：SSID=" + cred.ssid + "，密码=" + cred.password;
      log("由蓝牙名 " + name + " 推导 WiFi：" + cred.ssid + " / " + cred.password);
    }).catch(function (e) {
      $("credHint").textContent = "无法推导：" + e.message;
    });
  }

  $("btnManual").addEventListener("click", function () {
    var name = $("manualName").value.trim();
    if (name) selectDevice(name);
  });

  $("btnVin").addEventListener("click", function () {
    var vin = $("manualVin").value.trim();
    if (!vin) return;
    zhDiagCall("wifiCredentials", { vin: vin }).then(function (cred) {
      $("ssid").value = cred.ssid;
      $("pwd").value = cred.password;
      $("credHint").textContent = "已推导 WiFi 凭证：SSID=" + cred.ssid + "，密码=" + cred.password;
      log("由 VIN 推导 WiFi：" + cred.ssid + " / " + cred.password);
    }).catch(function (e) {
      $("credHint").textContent = e.message;
    });
  });

  // ---------- 步骤2：WiFi（iOS 引导手动连接） ----------
  $("btnWifiSettings").addEventListener("click", function () {
    var ssid = $("ssid").value.trim(), pwd = $("pwd").value;
    if (ssid && pwd) {
      try { navigator.clipboard.writeText(pwd); log("热点密码已复制：" + pwd); } catch (e) {}
    }
    zhDiagCall("openWifiSettings", {}).then(function (r) {
      log(r.message || "已打开系统设置");
    }).catch(function (e) { log("打开设置失败: " + e.message); });
  });

  // ---------- 步骤3：诊断 ----------
  $("btnDiagConnect").addEventListener("click", function () {
    var btn = $("btnDiagConnect");
    setBusy(btn, true, "连接中…");
    zhDiagCall("diagConnect", {}).then(function (r) {
      log(r.message);
      setPill(r.ok ? "诊断已连接" : "诊断未连接", r.ok ? "ok" : "err");
    }).catch(function (e) {
      log("连接失败: " + e.message);
      setPill("诊断未连接", "err");
    }).finally(function () { setBusy(btn, false); });
  });

  $("btnReadInfo").addEventListener("click", function () {
    var btn = $("btnReadInfo");
    setBusy(btn, true, "读取中…");
    zhDiagCall("readVehicleInfo", {}).then(function (r) {
      if (!r.ok) { log("读取失败: " + r.message); return; }
      var info = r.info;
      var kv = $("infoKv");
      kv.style.display = "grid";
      kv.innerHTML = "";
      var rows = [
        ["VIN 车架号", info.vin || "—"],
        ["软件版本", info.softwareVersion || "—"],
        ["零件号", info.partNumber || "—"],
        ["供应商", info.supplierName || "—"],
        ["总里程", info.totalMileage != null ? Number(info.totalMileage).toFixed(1) + " km" : "—"],
        ["IMEI", info.imei || "—"],
        ["NFC 卡数", info.cardCount != null ? String(info.cardCount) : "—"]
      ];
      rows.forEach(function (row) {
        kv.innerHTML += "<div class='k'>" + row[0] + "</div><div class='v'>" + row[1] + "</div>";
      });
      log("车辆信息读取完成");
    }).catch(function (e) { log("读取失败: " + e.message); })
      .finally(function () { setBusy(btn, false); });
  });

  $("btnCheckOnline").addEventListener("click", function () {
    var btn = $("btnCheckOnline");
    setBusy(btn, true, "检测中…");
    zhDiagCall("checkOnline", {}).then(function (r) {
      log("VCDM 节点: " + (r.online ? "在线" : "离线/无响应"));
    }).catch(function (e) { log("检测失败: " + e.message); })
      .finally(function () { setBusy(btn, false); });
  });

  $("btnReadFault").addEventListener("click", function () {
    var btn = $("btnReadFault");
    setBusy(btn, true, "读取中…");
    zhDiagCall("readFaultCodes", {}).then(function (r) {
      if (r.ok) {
        $("faultRow").style.display = "flex";
        $("faultHex").textContent = r.hex || "（空响应）";
      } else {
        log("读故障码失败: " + r.message);
      }
    }).catch(function (e) { log("读故障码失败: " + e.message); })
      .finally(function () { setBusy(btn, false); });
  });

  $("btnDiagDisconnect").addEventListener("click", function () {
    zhDiagCall("diagDisconnect", {}).then(function () {
      setPill("未连接", "");
      log("已断开诊断连接");
    }).catch(function () {});
  });

  setPill("未连接", "");
  log("极核诊断已启动。步骤：1) 蓝牙扫描或手动输入 → 2) 去系统设置连接车辆热点 → 3) 连接诊断接口并读取。");
})();
</script>
</body>
</html>
